<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#880e4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vendas" />
  <title>Vendas Promotoras</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    const app = initializeApp({ databaseURL: "https://promotoras-app-default-rtdb.firebaseio.com" });
    const db = getDatabase(app);
    window._fb = { db, ref, set, get, onValue, push, remove, update };
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    input, select, button, textarea { font-family: inherit; }
    select { appearance: none; -webkit-appearance: none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const SENHA_GESTORA = "092430";
const LOJAS = ["Nab Centro","Nab MDS","Nab Ário","Nab Polo","Nab Boituva","Origami SMT","Origami Cecap","Japonesa","Charm","Depósito 23","Villa","Gota de Sol 80"];
const PROMS_DEFAULT = ["Nede","Nely","Priscila","Darlane","Thaís Piracicaba","Fernanda Piracicaba","Ana Boituva","Thaís Indaiatuba","Tatiaria"];
const TIPOS_SOLIC = ["Produto com vencimento próximo","Solicitar sachês","Solicitar brindes","Informação importante","Outro"];
const JORNADA_MIN = 480;
const pink = "#e91e8c", dark = "#880e4f", grad = "linear-gradient(135deg,#880e4f,#e91e8c)";
const C = {
  card: { background:"#fff", borderRadius:20, padding:20, boxShadow:"0 2px 16px rgba(0,0,0,0.08)", marginBottom:12 },
  inp:  { width:"100%", border:"2px solid #e5e7eb", borderRadius:12, padding:"12px 16px", fontSize:16, outline:"none", background:"#fff" },
  btn:  { width:"100%", padding:"16px", borderRadius:14, fontWeight:700, fontSize:16, border:"none", cursor:"pointer", color:"#fff", background:grad },
  inp2: { border:"2px solid #e5e7eb", borderRadius:12, padding:"10px 14px", fontSize:14, outline:"none", background:"#fff" },
};

// helpers
const todayBR = () => {
  const d = new Date();
  const br = new Date(d.toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));
  return br.getFullYear()+"-"+String(br.getMonth()+1).padStart(2,"0")+"-"+String(br.getDate()).padStart(2,"0");
};
const nowBR = () => {
  const d = new Date();
  const br = new Date(d.toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));
  return String(br.getHours()).padStart(2,"0")+":"+String(br.getMinutes()).padStart(2,"0");
};
const fmt = t => t ? t.slice(0,5) : "--:--";
const fmtDate = d => { if(!d) return ""; const [y,m,dd]=d.split("-"); return `${dd}/${m}/${y}`; };
const fmtTS = ts => { if(!ts) return ""; const d=new Date(ts); return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); };
const toMin = t => { if(!t) return 0; const [h,m]=t.split(":").map(Number); return h*60+m; };
const calcMin = r => {
  if (!r||!r.entrada||!r.saidaFinal) return 0;
  let t = toMin(r.saidaFinal)-toMin(r.entrada);
  if (r.saidaAlmoco&&r.voltaAlmoco) t -= toMin(r.voltaAlmoco)-toMin(r.saidaAlmoco);
  return Math.max(0,t);
};
const fmtMin = m => `${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}`;
const getQ = d => { const [y,mo,dd]=d.split("-"); return Number(dd)<=15?`${y}-${mo}-01`:`${y}-${mo}-16`; };
const fimQ = q => { const [y,mo,dd]=q.split("-"); const u=new Date(Number(y),Number(mo),0).getDate(); return dd==="01"?`${y}-${mo}-15`:`${y}-${mo}-${u}`; };
const lblQ = q => { const [y,mo,dd]=q.split("-"); const u=new Date(Number(y),Number(mo),0).getDate(); return dd==="01"?`1 a 15/${mo}/${y}`:`16 a ${u}/${mo}/${y}`; };

// firebase
const fb = {
  get: async p => { const {db,ref,get}=window._fb; const s=await get(ref(db,p)); return s.exists()?s.val():null; },
  set: async (p,v) => { const {db,ref,set}=window._fb; await set(ref(db,p),v); },
  push: async (p,v) => { const {db,ref,push}=window._fb; const r=await push(ref(db,p),v); return r.key; },
  remove: async p => { const {db,ref,remove}=window._fb; await remove(ref(db,p)); },
  update: async (p,v) => { const {db,ref,update}=window._fb; await update(ref(db,p),v); },
  on: (p,cb) => { const {db,ref,onValue}=window._fb; return onValue(ref(db,p),s=>cb(s.exists()?s.val():null)); },
};

function Icone({size=64}) {
  return (
    <svg width={size} height={size} viewBox="0 0 64 64" fill="none">
      <ellipse cx="32" cy="18" rx="14" ry="8" fill="#f9a8d4" stroke="#e91e8c" strokeWidth="2"/>
      <rect x="18" y="18" width="28" height="34" rx="6" fill="#fce4ec" stroke="#e91e8c" strokeWidth="2"/>
      <ellipse cx="32" cy="18" rx="8" ry="4" fill="#e91e8c"/>
      <rect x="26" y="26" width="12" height="3" rx="1.5" fill="#e91e8c" opacity="0.4"/>
      <rect x="26" y="32" width="12" height="3" rx="1.5" fill="#e91e8c" opacity="0.4"/>
      <rect x="26" y="38" width="8" height="3" rx="1.5" fill="#e91e8c" opacity="0.4"/>
    </svg>
  );
}
function Spin() { return <div style={{textAlign:"center",padding:60,color:"#9ca3af"}}><div style={{fontSize:36}}>⏳</div><p style={{marginTop:12}}>Carregando...</p></div>; }

// ═══════════════════════════════════════════════════════════
// LOGIN PROMOTORA
// ═══════════════════════════════════════════════════════════
function LoginPromotora({onLogin}) {
  const [proms,setProms] = React.useState([]);
  const [loading,setLoading] = React.useState(true);
  const [nome,setNome] = React.useState("");
  const [senha,setSenha] = React.useState("");
  const [nova,setNova] = React.useState("");
  const [conf,setConf] = React.useState("");
  const [erro,setErro] = React.useState("");
  const [step,setStep] = React.useState("nome");

  React.useEffect(()=>{
    return fb.on("promotoras",val=>{
      if(val) setProms(Object.values(val));
      else { PROMS_DEFAULT.forEach(p=>fb.push("promotoras",p)); setProms(PROMS_DEFAULT); }
      setLoading(false);
    });
  },[]);

  const goNome = async () => {
    if(!nome) return;
    const s = await fb.get(`senhas/${nome.replace(/\s+/g,"_")}`);
    setStep(s?"senha":"cadastro"); setErro("");
  };
  const goSenha = async () => {
    const s = await fb.get(`senhas/${nome.replace(/\s+/g,"_")}`);
    if(s===senha) onLogin(nome); else { setErro("Senha incorreta."); setSenha(""); }
  };
  const goCad = async () => {
    if(nova.length!==4||!/^\d+$/.test(nova)){setErro("Deve ter 4 números.");return;}
    if(nova!==conf){setErro("Senhas não coincidem.");return;}
    await fb.set(`senhas/${nome.replace(/\s+/g,"_")}`,nova);
    onLogin(nome);
  };

  const bg = {minHeight:"100vh",background:"linear-gradient(135deg,#fce4ec,#f8bbd0)",display:"flex",alignItems:"center",justifyContent:"center",padding:20};

  if(loading) return <div style={bg}><Spin/></div>;

  if(step==="cadastro") return (
    <div style={bg}><div style={{...C.card,maxWidth:360,width:"100%",padding:32}}>
      <div style={{textAlign:"center",marginBottom:24}}><div style={{fontSize:48,marginBottom:8}}>🔐</div>
        <h2 style={{fontSize:20,fontWeight:700,color:"#1f2937"}}>Criar senha</h2>
        <p style={{fontSize:13,color:"#6b7280",marginTop:4}}>Olá <b>{nome}</b>! Crie sua senha de 4 números.</p>
      </div>
      <label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Nova senha</label>
      <input type="password" inputMode="numeric" maxLength={4} placeholder="0000" value={nova}
        onChange={e=>{setNova(e.target.value.replace(/\D/g,"").slice(0,4));setErro("");}}
        style={{...C.inp,marginTop:6,marginBottom:16,textAlign:"center",fontSize:24,letterSpacing:8}}/>
      <label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Confirmar</label>
      <input type="password" inputMode="numeric" maxLength={4} placeholder="0000" value={conf}
        onChange={e=>{setConf(e.target.value.replace(/\D/g,"").slice(0,4));setErro("");}}
        onKeyDown={e=>e.key==="Enter"&&goCad()}
        style={{...C.inp,marginTop:6,marginBottom:16,textAlign:"center",fontSize:24,letterSpacing:8}}/>
      {erro&&<p style={{color:"#ef4444",fontSize:13,marginBottom:12,textAlign:"center"}}>{erro}</p>}
      <button onClick={goCad} style={C.btn}>Criar senha e entrar</button>
      <button onClick={()=>{setStep("nome");setErro("");}} style={{...C.btn,background:"none",color:"#9ca3af",marginTop:8}}>← Voltar</button>
    </div></div>
  );

  if(step==="senha") return (
    <div style={bg}><div style={{...C.card,maxWidth:360,width:"100%",padding:32}}>
      <div style={{textAlign:"center",marginBottom:24}}><div style={{fontSize:48,marginBottom:8}}>👋</div>
        <h2 style={{fontSize:20,fontWeight:700,color:"#1f2937"}}>Olá, {nome}!</h2>
        <p style={{fontSize:13,color:"#6b7280",marginTop:4}}>Digite sua senha de 4 números</p>
      </div>
      <input type="password" inputMode="numeric" maxLength={4} placeholder="0000" value={senha}
        onChange={e=>{setSenha(e.target.value.replace(/\D/g,"").slice(0,4));setErro("");}}
        onKeyDown={e=>e.key==="Enter"&&goSenha()}
        style={{...C.inp,marginBottom:16,textAlign:"center",fontSize:28,letterSpacing:10}}/>
      {erro&&<p style={{color:"#ef4444",fontSize:13,marginBottom:12,textAlign:"center"}}>{erro}</p>}
      <button onClick={goSenha} style={C.btn}>Entrar</button>
      <button onClick={()=>{setStep("nome");setSenha("");setErro("");}} style={{...C.btn,background:"none",color:"#9ca3af",marginTop:8}}>← Voltar</button>
    </div></div>
  );

  return (
    <div style={bg}><div style={{maxWidth:360,width:"100%"}}>
      <div style={{textAlign:"center",marginBottom:32}}>
        <Icone size={72}/>
        <h1 style={{fontSize:26,fontWeight:700,color:"#1f2937",marginTop:12}}>Lançar Vendas</h1>
        <p style={{color:"#6b7280",fontSize:13,marginTop:4}}>{new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</p>
      </div>
      <div style={C.card}>
        <label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Qual é o seu nome?</label>
        <select style={{...C.inp,marginTop:6,marginBottom:20}} value={nome} onChange={e=>setNome(e.target.value)}>
          <option value="">Selecione seu nome...</option>
          {proms.map((p,i)=><option key={i}>{p}</option>)}
        </select>
        <button onClick={goNome} disabled={!nome} style={{...C.btn,opacity:nome?1:0.4}}>Continuar →</button>
      </div>
    </div></div>
  );
}

// ═══════════════════════════════════════════════════════════
// TELA PROMOTORA
// ═══════════════════════════════════════════════════════════
function TelaPromotora({promotora,onLogout}) {
  const [step,setStep] = React.useState("menu");
  const [loja,setLoja] = React.useState("");
  const [lojaFalta,setLojaFalta] = React.useState("");
  const [motivoFalta,setMotivoFalta] = React.useState("");
  const [tipoSolic,setTipoSolic] = React.useState("");
  const [descSolic,setDescSolic] = React.useState("");
  const [mesHist,setMesHist] = React.useState(todayBR().slice(0,7));
  const [saving,setSaving] = React.useState(false);
  const [regsHoje,setRegsHoje] = React.useState([]);
  const [todosRegs,setTodosRegs] = React.useState([]);
  const [solics,setSolics] = React.useState([]);
  const [pagtos,setPagtos] = React.useState([]);
  const [passagens,setPassagens] = React.useState([]);
  const [valDiario,setValDiario] = React.useState(0);
  const [pecasInput,setPecasInput] = React.useState("");
  const [editPecas,setEditPecas] = React.useState(false);

  React.useEffect(()=>{
    const u1=fb.on("registros",val=>{
      const arr=val?Object.entries(val).map(([k,v])=>({...v,_k:k})).filter(r=>r.promotora===promotora):[];
      setRegsHoje(arr.filter(r=>r.data===todayBR()));
      setTodosRegs(arr);
    });
    const u2=fb.on("solicitacoes",val=>{
      setSolics(val?Object.entries(val).map(([k,v])=>({...v,_k:k})).filter(s=>s.promotora===promotora).sort((a,b)=>b.ts-a.ts):[]);
    });
    const u3=fb.on("pagamentos",val=>{
      setPagtos(val?Object.entries(val).map(([k,v])=>({...v,_k:k})).filter(p=>p.promotora===promotora).sort((a,b)=>b.pagoEm-a.pagoEm):[]);
    });
    const u4=fb.on(`valoresDiarios/${promotora.replace(/\s+/g,"_")}`,val=>setValDiario(val||0));
    const u5=fb.on("passagens",val=>{
      setPassagens(val?Object.entries(val).map(([k,v])=>({...v,_k:k})).filter(p=>p.promotora===promotora).sort((a,b)=>(b.ts||0)-(a.ts||0)):[]);
    });
    return ()=>{u1();u2();u3();u4();u5();};
  },[promotora]);

  const regHoje = regsHoje.find(r=>r.loja===loja&&r.tipo==="venda");
  const pendSolics = solics.filter(s=>s.status==="pendente").length;

  const lancarPonto = async campo => {
    if(saving) return;
    setSaving(true);
    const hora = nowBR();
    if(regHoje?._k) await fb.update(`registros/${regHoje._k}`,{[campo]:hora});
    else await fb.push("registros",{promotora,loja,data:todayBR(),tipo:"venda",[campo]:hora,pecas:0,ts:Date.now()});
    setSaving(false);
  };

  const salvarPecas = async () => {
    if(!pecasInput||saving) return;
    setSaving(true);
    if(regHoje?._k) await fb.update(`registros/${regHoje._k}`,{pecas:Number(pecasInput)});
    else await fb.push("registros",{promotora,loja,data:todayBR(),tipo:"venda",pecas:Number(pecasInput),ts:Date.now()});
    setSaving(false);
    setEditPecas(false);
  };

  const salvarFalta = async () => {
    if(!lojaFalta||!motivoFalta.trim()||saving) return;
    setSaving(true);
    await fb.push("registros",{promotora,loja:lojaFalta,data:todayBR(),tipo:"falta",motivo:motivoFalta,ts:Date.now()});
    setSaving(false);
    setStep("okFalta");
  };

  const salvarSolic = async () => {
    if(!tipoSolic||!descSolic.trim()||saving) return;
    setSaving(true);
    await fb.push("solicitacoes",{promotora,tipo:tipoSolic,descricao:descSolic,status:"pendente",ts:Date.now()});
    setSaving(false);
    setTipoSolic(""); setDescSolic("");
    setStep("okSolic");
  };

  const bg = {minHeight:"100vh",background:"linear-gradient(135deg,#fce4ec,#f8bbd0)",padding:20};

  // OK screens
  if(step==="okFalta") return (
    <div style={{...bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{...C.card,textAlign:"center",maxWidth:360,width:"100%",padding:32}}>
        <div style={{fontSize:64,marginBottom:12}}>📝</div>
        <h2 style={{fontSize:24,fontWeight:700,color:"#1f2937",marginBottom:8}}>Falta registrada!</h2>
        <p style={{color:"#6b7280"}}>{lojaFalta}</p>
        <p style={{color:"#9ca3af",fontSize:13,marginTop:8}}>Motivo: <b>{motivoFalta}</b></p>
        <button onClick={()=>{setStep("menu");setLojaFalta("");setMotivoFalta("");}} style={{...C.btn,marginTop:24}}>Voltar ao início</button>
      </div>
    </div>
  );

  if(step==="okSolic") return (
    <div style={{...bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{...C.card,textAlign:"center",maxWidth:360,width:"100%",padding:32}}>
        <div style={{fontSize:64,marginBottom:12}}>📨</div>
        <h2 style={{fontSize:24,fontWeight:700,color:"#1f2937",marginBottom:8}}>Enviado!</h2>
        <p style={{color:"#6b7280",fontSize:13}}>A gestora foi notificada.</p>
        <button onClick={()=>setStep("menu")} style={{...C.btn,marginTop:24}}>Voltar ao início</button>
      </div>
    </div>
  );

  // Ponto em tempo real
  if(step==="ponto") {
    const reg = regsHoje.find(r=>r.loja===loja&&r.tipo==="venda");
    const mins = calcMin(reg);
    const pct = reg?.saidaFinal ? Math.min(100,(mins/JORNADA_MIN)*100) : 0;

    const PontoBtn = ({campo,label,icon}) => {
      const done = reg && !!reg[campo];
      return (
        <div style={{...C.card,marginBottom:10,borderLeft:done?"4px solid #16a34a":"4px solid #e5e7eb"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <p style={{fontWeight:700,color:"#1f2937"}}>{icon} {label}</p>
              {done
                ? <p style={{fontSize:13,color:"#16a34a",marginTop:2}}>✅ Registrado às {reg[campo]}</p>
                : <p style={{fontSize:12,color:"#9ca3af",marginTop:2}}>Ainda não registrado</p>}
            </div>
            {!done&&(
              <button onClick={()=>lancarPonto(campo)} disabled={saving}
                style={{padding:"10px 16px",borderRadius:12,fontWeight:700,fontSize:13,border:"none",cursor:"pointer",color:"#fff",background:grad,opacity:saving?0.5:1,whiteSpace:"nowrap"}}>
                {saving?"...":"Registrar agora"}
              </button>
            )}
          </div>
        </div>
      );
    };

    return (
      <div style={{minHeight:"100vh",background:"#f9f4f7"}}>
        <div style={{padding:"28px 20px 20px",background:grad}}>
          <button onClick={()=>setStep("loja")} style={{background:"none",border:"none",color:"#f9a8d4",fontWeight:600,fontSize:14,cursor:"pointer",marginBottom:8,padding:0}}>← Voltar</button>
          <p style={{color:"#f9a8d4",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>Ponto do dia</p>
          <h1 style={{color:"#fff",fontSize:20,fontWeight:700,marginTop:2}}>{promotora}</h1>
          <p style={{color:"#f9a8d4",fontSize:13}}>{loja} · {fmtDate(todayBR())}</p>
          {reg?.saidaFinal&&<div style={{marginTop:10,background:"rgba(255,255,255,0.2)",borderRadius:12,padding:"8px 14px",display:"inline-block"}}>
            <p style={{color:"#fff",fontSize:13,fontWeight:700}}>{fmtMin(mins)} trabalhadas · {pct.toFixed(0)}% da jornada</p>
          </div>}
        </div>
        <div style={{padding:16}}>
          {reg?.saidaFinal&&(
            <div style={{...C.card,background:"linear-gradient(135deg,#f0fdf4,#dcfce7)",border:"2px solid #16a34a",marginBottom:16}}>
              <p style={{fontWeight:700,color:"#16a34a",fontSize:15,marginBottom:6}}>✅ Dia concluído!</p>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:13,color:"#1f2937"}}>Horas trabalhadas:</span>
                <span style={{fontWeight:700,color:"#16a34a"}}>{fmtMin(mins)} de {fmtMin(JORNADA_MIN)}</span>
              </div>
              <div style={{height:8,background:"#bbf7d0",borderRadius:99,overflow:"hidden",marginBottom:4}}>
                <div style={{height:"100%",borderRadius:99,width:`${pct}%`,background:"#16a34a"}}/>
              </div>
            </div>
          )}
          <PontoBtn campo="entrada" label="Entrada" icon="🟢"/>
          <PontoBtn campo="saidaAlmoco" label="Saída almoço" icon="🍽️"/>
          <PontoBtn campo="voltaAlmoco" label="Volta almoço" icon="🔄"/>
          <PontoBtn campo="saidaFinal" label="Saída final" icon="🔴"/>
          <div style={C.card}>
            <label style={{fontSize:12,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Total de peças vendidas</label>
            {(editPecas||!reg?.pecas)
              ? <div style={{display:"flex",gap:8,marginTop:8}}>
                  <input type="number" min="0" placeholder="0" value={pecasInput}
                    onChange={e=>setPecasInput(e.target.value)}
                    style={{...C.inp,fontSize:22,fontWeight:700,textAlign:"center",color:pink,flex:1}}/>
                  <button onClick={salvarPecas} style={{padding:"12px 16px",borderRadius:12,fontWeight:700,fontSize:14,border:"none",cursor:"pointer",color:"#fff",background:"#16a34a"}}>✓</button>
                </div>
              : <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8}}>
                  <p style={{fontSize:32,fontWeight:700,color:pink}}>{reg.pecas} peças</p>

  // Pagamentos
  if(step==="pagamentos") {
    const qAtual=getQ(todayBR());
    const diasQ=q=>{const ini=q,fim=fimQ(q);return todosRegs.filter(r=>r.tipo==="venda"&&r.data>=ini&&r.data<=fim).reduce((s,r)=>{s.add(r.data);return s;},new Set()).size;};
    const valorQ=q=>{
      const ini=q,fim=fimQ(q);
      const byDay={};
      todosRegs.filter(r=>r.tipo==="venda"&&r.data>=ini&&r.data<=fim).forEach(r=>{byDay[r.data]=r;});
      let tot=0;
      Object.values(byDay).forEach(r=>{const m=calcMin(r);tot+=valDiario*(m===0?1:Math.min(1,m/JORNADA_MIN));});
      return tot;
    };
    const pagoQ=q=>pagtos.find(p=>p.quinzena===q);

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <p style={{fontSize:13,color:"#6b7280"}}>{dAtual} dias trabalhados</p>

              <div style={{textAlign:"right"}}>
                <p style={{fontSize:28,fontWeight:700,color:pAtual?"#16a34a":pink}}>R$ {vAtual.toFixed(2).replace(".",",")}</p>
                <span style={{fontSize:11,fontWeight:700,padding:"2px 10px",borderRadius:99,background:pAtual?"#dcfce7":"#fef3c7",color:pAtual?"#16a34a":"#92400e"}}>{pAtual?"✅ Pago":"⏳ Pendente"}</span>
              </div>

                  </div>
                  <div style={{textAlign:"right"}}>
                    <p style={{fontSize:20,fontWeight:700,color:"#16a34a"}}>R$ {(p.valor||0).toFixed(2).replace(".",",")}</p>

                  </div>
                </div>
              </div>
            ))}
          </>}
        </div>
      </div>
    );
  }

  // Passagens
  if(step==="passagens") return (
    <div style={{minHeight:"100vh",background:"#f9f4f7"}}>
      <div style={{padding:"32px 20px 20px",background:grad}}>
        <button onClick={()=>setStep("menu")} style={{background:"none",border:"none",color:"#f9a8d4",fontWeight:600,fontSize:14,cursor:"pointer",marginBottom:8,padding:0}}>← Voltar</button>
        <h1 style={{color:"#fff",fontSize:22,fontWeight:700}}>Minhas passagens</h1>
        <p style={{color:"#f9a8d4",fontSize:13,marginTop:2}}>{promotora}</p>
      </div>
      <div style={{padding:16}}>
        {passagens.length===0
          ?<div style={{textAlign:"center",padding:"60px 0",color:"#9ca3af"}}><div style={{fontSize:48,marginBottom:12}}>🚌</div><p style={{fontWeight:600}}>Nenhuma passagem registrada</p><p style={{fontSize:13,marginTop:8}}>A gestora registra aqui quando pagar sua passagem.</p></div>
          :passagens.map(p=>(
            <div key={p._k} style={{...C.card,borderLeft:"4px solid #0ea5e9"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <p style={{fontWeight:700,color:"#1f2937",fontSize:15}}>🚌 {fmtDate(p.dataInicio)} a {fmtDate(p.dataFim)}</p>
                  <p style={{fontSize:22,fontWeight:700,color:"#0ea5e9",marginTop:4}}>R$ {(p.valor||0).toFixed(2).replace(".",",")}</p>
                  {p.obs&&<p style={{fontSize:13,color:"#6b7280",marginTop:4}}>{p.obs}</p>}
                  <p style={{fontSize:11,color:"#9ca3af",marginTop:4}}>{fmtTS(p.ts)}</p>
                </div>
                {p.comprovante&&<a href={p.comprovante} download="passagem.pdf" style={{fontSize:12,color:"#0ea5e9",fontWeight:700,textDecoration:"none",marginLeft:8}}>📄 Baixar</a>}
              </div>
            </div>
          ))}
      </div>
    </div>
  );

  // Menu principal
  const vendasHoje=regsHoje.filter(r=>r.tipo==="venda").length;
  return (
    <div style={{minHeight:"100vh",background:grad,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{textAlign:"center",marginBottom:24}}>
        <Icone size={60}/>
        <h1 style={{fontSize:22,fontWeight:700,color:"#fff",marginTop:10}}>Olá, {promotora}! 👋</h1>
        <p style={{color:"#fce4ec",fontSize:13,marginTop:4}}>{new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</p>
        {vendasHoje>0&&<div style={{marginTop:10,background:"rgba(255,255,255,0.2)",borderRadius:12,padding:"6px 14px",display:"inline-block"}}>
          <p style={{color:"#fff",fontSize:12}}>✅ Ponto lançado hoje</p>

        <button onClick={onLogout} style={{padding:"8px",borderRadius:12,fontWeight:600,fontSize:12,border:"none",cursor:"pointer",color:"rgba(255,255,255,0.4)",background:"transparent",marginTop:4}}>Sair da conta</button>
      </div>
    </div>
  );
}

// DASHBOARD GESTORA
// ═══════════════════════════════════════════════════════════
function Dashboard({onLogout}) {
  const [tab,setTab] = React.useState("hoje");
  const [mesRef,setMesRef] = React.useState(todayBR().slice(0,7));
  const [regs,setRegs] = React.useState([]);
  const [proms,setProms] = React.useState([]);
  const [senhas,setSenhas] = React.useState({});
  const [solics,setSolics] = React.useState([]);
  const [pagtos,setPagtos] = React.useState([]);
  const [passagens,setPassagens] = React.useState([]);
  const [valDia,setValDia] = React.useState({});
  const [loading,setLoading] = React.useState(true);
  const [promoDetalhe,setPromoDetalhe] = React.useState(null);
  const [novaP,setNovaP] = React.useState("");
  const [editIdx,setEditIdx] = React.useState(null);
  const [editVal,setEditVal] = React.useState("");
  const [resposta,setResposta] = React.useState({});
  const [quinzenaSel,setQuinzenaSel] = React.useState(getQ(todayBR()));
  const [novoValor,setNovoValor] = React.useState({});
  const [pdfFiles,setPdfFiles] = React.useState({});
  const [salvandoPag,setSalvandoPag] = React.useState({});
  const [novaPass,setNovaPass] = React.useState({promotora:"",dataInicio:"",dataFim:"",valor:"",obs:""});
  const [pdfPass,setPdfPass] = React.useState(null);
  const [salvandoPass,setSalvandoPass] = React.useState(false);
  const [editReg,setEditReg] = React.useState(null);
  const [editForm,setEditForm] = React.useState({});
  const [filtroEdit,setFiltroEdit] = React.useState("");

  React.useEffect(()=>{
    const u1=fb.on("registros",val=>{setRegs(val?Object.entries(val).map(([k,v])=>({...v,_k:k})):[]);setLoading(false);});
    const u2=fb.on("promotoras",val=>{setProms(val?Object.entries(val).map(([k,v])=>({_k:k,nome:v})):[]);});
    const u3=fb.on("senhas",val=>setSenhas(val||{}));
    const u4=fb.on("solicitacoes",val=>setSolics(val?Object.entries(val).map(([k,v])=>({...v,_k:k})).sort((a,b)=>b.ts-a.ts):[]));
    const u5=fb.on("pagamentos",val=>setPagtos(val?Object.entries(val).map(([k,v])=>({...v,_k:k})):[]));
    const u6=fb.on("valoresDiarios",val=>setValDia(val||{}));
    const u7=fb.on("passagens",val=>setPassagens(val?Object.entries(val).map(([k,v])=>({...v,_k:k})).sort((a,b)=>(b.ts||0)-(a.ts||0)):[]));
    return ()=>{u1();u2();u3();u4();u5();u6();u7();};
  },[]);

  const wk=()=>{const d=new Date(),day=d.getDay();const mon=new Date(d);mon.setDate(d.getDate()-day+(day===0?-6:1));const sun=new Date(mon);sun.setDate(mon.getDate()+6);return[mon.toISOString().split("T")[0],sun.toISOString().split("T")[0]];};
  const [wS,wE]=wk();
  const filterBy=t=>{if(t==="hoje")return regs.filter(r=>r.data===todayBR());if(t==="semana")return regs.filter(r=>r.data>=wS&&r.data<=wE);if(t==="mes")return regs.filter(r=>r.data&&r.data.startsWith(mesRef));return regs;};
  const vendas=arr=>arr.filter(r=>r.tipo==="venda");
  const sumP=arr=>vendas(arr).reduce((s,r)=>s+(r.pecas||0),0);
  const byGrp=(arr,k)=>{const m={};vendas(arr).forEach(r=>{m[r[k]]=(m[r[k]]||0)+(r.pecas||0);});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const cur=filterBy(["hoje","semana","mes"].includes(tab)?tab:"hoje");
  const totAll=sumP(regs);
  const solPend=solics.filter(s=>s.status==="pendente").length;

  const nomesKey=n=>n.replace(/\s+/g,"_");
  const valorQ=(prom,q)=>{
    const ini=q,fim=fimQ(q);
    const vd=valDia[nomesKey(prom)]||0;
    const byDay={};
    regs.filter(r=>r.tipo==="venda"&&r.data>=ini&&r.data<=fim&&r.promotora?.trim().toLowerCase()===prom.trim().toLowerCase()).forEach(r=>{byDay[r.data]=r;});
    let tot=0;
    Object.values(byDay).forEach(r=>{const m=calcMin(r);tot+=vd*(m===0?1:Math.min(1,m/JORNADA_MIN));});
    return{total:tot,dias:Object.keys(byDay).length};
  };

  const addP=async()=>{if(!novaP.trim())return;await fb.push("promotoras",novaP.trim());setNovaP("");};
  const removeP=async(k,n)=>{if(!window.confirm(`Remover ${n}?`))return;await fb.remove(`promotoras/${k}`);};
  const saveEdit=async k=>{await fb.set(`promotoras/${k}`,editVal);setEditIdx(null);};
  const resolver=async(k,resp)=>{await fb.update(`solicitacoes/${k}`,{status:"resolvido",resposta:resp||"Resolvido",resolvidoEm:Date.now()});};

  const regPag=async prom=>{
    setSalvandoPag(x=>({...x,[prom]:true}));
    const{total:valor,dias}=valorQ(prom,quinzenaSel);
    const file=pdfFiles[prom];let compUrl="";
    if(file){const r=new FileReader();compUrl=await new Promise(res=>{r.onload=e=>res(e.target.result);r.readAsDataURL(file);});}
    await fb.push("pagamentos",{promotora:prom,quinzena:quinzenaSel,dias,valor,comprovante:compUrl,pagoEm:Date.now()});
    setSalvandoPag(x=>({...x,[prom]:false}));setPdfFiles(x=>({...x,[prom]:null}));
  };

  const salvarValor=async nome=>{const v=novoValor[nome];if(!v)return;await fb.set(`valoresDiarios/${nomesKey(nome)}`,Number(v));setNovoValor(x=>({...x,[nome]:""}));};

  const regPass=async()=>{
    if(!novaPass.promotora||!novaPass.dataInicio||!novaPass.dataFim||!novaPass.valor)return;
    setSalvandoPass(true);
    let compUrl="";
    if(pdfPass){const r=new FileReader();compUrl=await new Promise(res=>{r.onload=e=>res(e.target.result);r.readAsDataURL(pdfPass);});}
    await fb.push("passagens",{promotora:novaPass.promotora,dataInicio:novaPass.dataInicio,dataFim:novaPass.dataFim,valor:Number(novaPass.valor),obs:novaPass.obs||"",comprovante:compUrl,ts:Date.now()});
    setNovaPass({promotora:"",dataInicio:"",dataFim:"",valor:"",obs:""});setPdfPass(null);setSalvandoPass(false);
  };

  const printRel=tipo=>{
    const arr=tipo==="mes"?regs.filter(r=>r.data&&r.data.startsWith(mesRef)):regs;
    const vArr=vendas(arr);const tot=sumP(arr);
    const byP=byGrp(arr,"promotora");const byL=byGrp(arr,"loja");
    const label=tipo==="mes"?`${mesRef.split("-")[1]}/${mesRef.split("-")[0]}`:"Geral";
    const w=window.open("","_blank");
    w.document.write(`<!DOCTYPE html><html><head><title>Relatório ${label}</title><style>body{font-family:Arial,sans-serif;padding:20px}h1{color:#880e4f;border-bottom:2px solid #880e4f;padding-bottom:8px}h2{color:#880e4f;margin-top:20px;font-size:16px}table{width:100%;border-collapse:collapse;margin-top:10px}th{background:#880e4f;color:white;padding:8px;text-align:left}td{padding:8px;border-bottom:1px solid #eee}.tot{font-size:18px;font-weight:bold;color:#880e4f}@media print{button{display:none}}</style></head><body>`);
    w.document.write(`<h1>📊 Relatório — ${label}</h1><p class="tot">Total: ${tot} peças | ${vArr.length} lançamentos</p>`);
    w.document.write(`<h2>Por Promotora</h2><table><tr><th>Promotora</th><th>Peças</th><th>Dias</th><th>Faltas</th><th>Média/dia</th></tr>`);
    byP.forEach(([p,q])=>{const d=[...new Set(vArr.filter(r=>r.promotora===p).map(r=>r.data))].length;const f=arr.filter(r=>r.promotora===p&&r.tipo==="falta").length;w.document.write(`<tr><td>${p}</td><td><b>${q}</b></td><td>${d}</td><td>${f}</td><td>${d?(q/d).toFixed(1):0}</td></tr>`);});
    w.document.write(`</table><h2>Por Loja</h2><table><tr><th>Loja</th><th>Peças</th><th>%</th></tr>`);
    byL.forEach(([l,q])=>w.document.write(`<tr><td>${l}</td><td><b>${q}</b></td><td>${tot?(q/tot*100).toFixed(1):0}%</td></tr>`));
    w.document.write(`</table><br><button onclick="window.print()">🖨️ Imprimir</button></body></html>`);
    w.document.close();
  };

  const tabs=[{id:"hoje",label:"Hoje"},{id:"semana",label:"Semana"},{id:"mes",label:"Mês"},{id:"lojas",label:"Lojas"},{id:"ranking",label:"Ranking"},{id:"solic",label:`📋${solPend>0?` (${solPend})`:""}`},{id:"pagamento",label:"💰"},{id:"passagens",label:"🚌"},{id:"relatorio",label:"📄"},{id:"editar",label:"✏️"},{id:"config",label:"⚙️"}];

  if(loading) return <Spin/>;

  // Detalhe promotora
  if(promoDetalhe){
    const rP=regs.filter(r=>r.promotora===promoDetalhe).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
    const vP=rP.filter(r=>r.tipo==="venda");const fP=rP.filter(r=>r.tipo==="falta");
    const totP=vP.reduce((s,r)=>s+(r.pecas||0),0);const diasP=[...new Set(vP.map(r=>r.data))].length;
    const lojasP=[...new Set(vP.map(r=>r.loja))];
    return(
      <div style={{minHeight:"100vh",background:"#f9f4f7"}}>
        <div style={{padding:"32px 20px 20px",background:grad}}>

          <h1 style={{color:"#fff",fontSize:22,fontWeight:700}}>{promoDetalhe}</h1>
          <p style={{color:"#f9a8d4",fontSize:13,marginTop:2}}>{diasP} dias · {fP.length} falta{fP.length!==1?"s":""}</p>
        </div>
        <div style={{padding:16}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
            <div style={{...C.card,textAlign:"center",marginBottom:0}}><p style={{fontSize:32,fontWeight:700,color:pink}}>{totP}</p><p style={{fontSize:12,color:"#9ca3af"}}>peças total</p></div>
            <div style={{...C.card,textAlign:"center",marginBottom:0}}><p style={{fontSize:32,fontWeight:700,color:"#7c3aed"}}>{diasP>0?(totP/diasP).toFixed(1):0}</p><p style={{fontSize:12,color:"#9ca3af"}}>média/dia</p></div>
          </div>
          {lojasP.length>0&&<div style={{...C.card,marginBottom:12}}><p style={{fontSize:12,fontWeight:700,color:"#6b7280",marginBottom:8}}>LOJAS</p>
            {lojasP.map(l=>{const q=vP.filter(r=>r.loja===l).reduce((s,r)=>s+(r.pecas||0),0);return(
              <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #f3f4f6"}}><span style={{fontSize:14,color:"#1f2937"}}>{l}</span><span style={{fontWeight:700,color:pink}}>{q} peças</span></div>
            );})}
          </div>}
          <p style={{fontWeight:700,fontSize:15,color:"#1f2937",marginBottom:8}}>Histórico</p>
          {rP.map(r=>(
            <div key={r._k} style={{...C.card,padding:"14px 16px",borderLeft:r.tipo==="falta"?"4px solid #ef4444":"4px solid #e91e8c"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <p style={{fontWeight:700,color:"#1f2937",fontSize:14}}>{fmtDate(r.data)}</p>
                  <p style={{fontSize:13,color:"#6b7280"}}>{r.loja}</p>
                  {r.tipo==="falta"&&<p style={{fontSize:12,color:"#ef4444",marginTop:2}}>Falta: {r.motivo}</p>}
                  {r.tipo==="venda"&&<p style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{r.entrada?`Entrada ${fmt(r.entrada)}`:""}  {r.saidaFinal?`Saída ${fmt(r.saidaFinal)}`:""} {r.entrada&&r.saidaFinal?`· ${fmtMin(calcMin(r))}`:""}</p>}
                </div>
                {r.tipo==="venda"&&<div style={{textAlign:"right"}}><p style={{fontSize:22,fontWeight:700,color:pink}}>{r.pecas}</p><p style={{fontSize:11,color:"#9ca3af"}}>peças</p></div>}
                {r.tipo==="falta"&&<span style={{fontSize:20}}>😷</span>}
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return(
    <div style={{minHeight:"100vh",background:"#f9f4f7"}}>
      <div style={{padding:"32px 20px 20px",background:grad}}>
        <p style={{color:"#f9a8d4",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:2}}>Painel da Gestora</p>

      <div style={{display:"flex",overflowX:"auto",padding:"12px 16px",gap:8,background:"#fff",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>

        {["hoje","semana","mes"].includes(tab)&&<>
          {tab==="mes"&&<input type="month" value={mesRef} onChange={e=>setMesRef(e.target.value)} style={{...C.inp2,width:"100%",marginBottom:12}}/>}
          <div style={{borderRadius:20,padding:"20px 24px",color:"#fff",textAlign:"center",marginBottom:12,background:grad}}>
            <p style={{color:"#f9a8d4",fontSize:13}}>Total — {tab==="hoje"?"hoje":tab==="semana"?"esta semana":"este mês"}</p>
            <p style={{fontSize:52,fontWeight:700,lineHeight:1.1,marginTop:4}}>{sumP(cur)}</p>
            <p style={{color:"#f9a8d4",fontSize:12,marginTop:4}}>{vendas(cur).length} lançamentos · {cur.filter(r=>r.tipo==="falta").length} faltas</p>
          </div>
          {vendas(cur).length===0&&cur.filter(r=>r.tipo==="falta").length===0
            ?<div style={{textAlign:"center",padding:"40px 0",color:"#9ca3af"}}><div style={{fontSize:40,marginBottom:8}}>📭</div><p>Nenhum lançamento</p></div>
            :byGrp(cur,"promotora").map(([p,q])=>{
              const d=[...new Set(vendas(cur).filter(r=>r.promotora===p).map(r=>r.data))].length;
              const f=cur.filter(r=>r.promotora===p&&r.tipo==="falta").length;
              return<div key={p} onClick={()=>setPromoDetalhe(p)} style={{...C.card,display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer"}}>
                <div><p style={{fontWeight:700,color:"#1f2937"}}>{p}</p><p style={{fontSize:12,color:"#9ca3af"}}>{d} dia{d!==1?"s":""} · {f>0?`${f} falta${f!==1?"s":""}`:"sem faltas"}</p></div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{textAlign:"right"}}><p style={{fontSize:28,fontWeight:700,color:pink}}>{q}</p><p style={{fontSize:11,color:"#9ca3af"}}>peças</p></div>
                  <span style={{color:"#d1d5db"}}>›</span>
                </div>
              </div>;
            })}
        </>}

        {tab==="lojas"&&<>
          <div style={{borderRadius:20,padding:"20px 24px",color:"#fff",textAlign:"center",marginBottom:12,background:"linear-gradient(135deg,#4a148c,#880e4f)"}}>
            <p style={{color:"#e9d5ff",fontSize:13}}>Total por loja</p>
            <p style={{fontSize:52,fontWeight:700,lineHeight:1.1,marginTop:4}}>{totAll}</p>
          </div>
          {byGrp(regs,"loja").map(([l,q],i)=>(
            <div key={l} style={{...C.card,display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:16,fontWeight:700,color:"#d1d5db",width:24}}>#{i+1}</span>
              <div style={{flex:1}}><p style={{fontWeight:700,color:"#1f2937",marginBottom:6}}>{l}</p>
                <div style={{height:6,background:"#f3e8ff",borderRadius:99,overflow:"hidden"}}>
                  <div style={{height:"100%",borderRadius:99,width:`${totAll?(q/totAll)*100:0}%`,background:"linear-gradient(90deg,#880e4f,#e91e8c)"}}/>
                </div>
              </div>
              <div style={{textAlign:"right"}}><p style={{fontSize:24,fontWeight:700,color:pink}}>{q}</p><p style={{fontSize:11,color:"#9ca3af"}}>peças</p></div>
            </div>
          ))}
        </>}

        {tab==="ranking"&&<>
          <div style={{borderRadius:20,padding:"20px 24px",color:"#fff",textAlign:"center",marginBottom:12,background:"linear-gradient(135deg,#1a237e,#283593)"}}>
            <p style={{color:"#bfdbfe",fontSize:13}}>Ranking geral</p>
            <p style={{fontSize:52,fontWeight:700,lineHeight:1.1,marginTop:4}}>{totAll}</p>
          </div>
          {byGrp(regs,"promotora").map(([p,q],i)=>{
            const d=[...new Set(vendas(regs).filter(r=>r.promotora===p).map(r=>r.data))].length;
            const f=regs.filter(r=>r.promotora===p&&r.tipo==="falta").length;
            const m=i===0?"🥇":i===1?"🥈":i===2?"🥉":`#${i+1}`;
            return<div key={p} onClick={()=>setPromoDetalhe(p)} style={{...C.card,cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:22}}>{m}</span>
                  <div><p style={{fontWeight:700,color:"#1f2937"}}>{p}</p><p style={{fontSize:12,color:"#9ca3af"}}>{d} dias · {f} falta{f!==1?"s":""} · média {d?(q/d).toFixed(1):0}/dia</p></div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{textAlign:"right"}}><p style={{fontSize:28,fontWeight:700,color:pink}}>{q}</p><p style={{fontSize:11,color:"#9ca3af"}}>total</p></div>
                  <span style={{color:"#d1d5db"}}>›</span>
                </div>
              </div>
            </div>;
          })}
        </>}

        {tab==="solic"&&<>
          <p style={{fontWeight:700,fontSize:18,color:"#1f2937",marginBottom:12}}>Solicitações {solPend>0&&<span style={{fontSize:13,background:"#fef3c7",color:"#92400e",padding:"2px 10px",borderRadius:99}}>{solPend} pendente{solPend!==1?"s":""}</span>}</p>
          {solics.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#9ca3af"}}><div style={{fontSize:40,marginBottom:8}}>📭</div><p>Nenhuma solicitação</p></div>
          :solics.map(s=>(
            <div key={s._k} style={{...C.card,borderLeft:s.status==="resolvido"?"4px solid #16a34a":"4px solid #f59e0b"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div style={{flex:1}}>
                  <p style={{fontWeight:700,color:"#1f2937",fontSize:14}}>{s.promotora}</p>
                  <p style={{fontSize:13,color:pink,fontWeight:600}}>{s.tipo}</p>
                  <p style={{fontSize:13,color:"#6b7280",marginTop:4}}>{s.descricao}</p>
                  <p style={{fontSize:11,color:"#9ca3af",marginTop:4}}>{fmtTS(s.ts)}</p>
                  {s.resposta&&<p style={{fontSize:12,color:"#16a34a",marginTop:4}}>✓ {s.resposta}</p>}
                </div>
                <span style={{fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:99,background:s.status==="resolvido"?"#dcfce7":"#fef3c7",color:s.status==="resolvido"?"#16a34a":"#92400e",marginLeft:8,flexShrink:0}}>
                  {s.status==="resolvido"?"Resolvido":"Pendente"}
                </span>
              </div>
              {s.status==="pendente"&&<div style={{display:"flex",gap:8,marginTop:8}}>
                <input placeholder="Resposta (opcional)" value={resposta[s._k]||""} onChange={e=>setResposta(r=>({...r,[s._k]:e.target.value}))} style={{...C.inp2,flex:1,fontSize:13,padding:"8px 12px"}}/>
                <button onClick={()=>resolver(s._k,resposta[s._k])} style={{padding:"8px 16px",borderRadius:10,fontWeight:700,fontSize:13,border:"none",cursor:"pointer",color:"#fff",background:"#16a34a",whiteSpace:"nowrap"}}>✓ OK</button>
              </div>}
            </div>
          ))}

        {tab==="pagamento"&&<>
          <p style={{fontWeight:700,fontSize:18,color:"#1f2937",marginBottom:4}}>💰 Pagamentos</p>
          <div style={{display:"flex",gap:8,marginBottom:12,overflowX:"auto",paddingBottom:4}}>
            {[...new Set([getQ(todayBR()),...regs.map(r=>r.data?getQ(r.data):null).filter(Boolean)])].slice(0,6).map(q=>(
              <button key={q} onClick={()=>setQuinzenaSel(q)} style={{flexShrink:0,padding:"6px 14px",borderRadius:99,fontSize:12,fontWeight:600,border:"none",cursor:"pointer",background:quinzenaSel===q?grad:"#fce4ec",color:quinzenaSel===q?"#fff":"#880e4f"}}>{lblQ(q)}</button>
            ))}
          </div>
          {proms.map(({nome:prom})=>{
            const vd=valDia[nomesKey(prom)]||0;

            const pago=pagtos.find(p=>p.promotora===prom&&p.quinzena===quinzenaSel);
            return(
              <div key={prom} style={{...C.card,borderLeft:pago?"4px solid #16a34a":"4px solid #f59e0b"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <div><p style={{fontWeight:700,color:"#1f2937"}}>{prom}</p><p style={{fontSize:12,color:"#6b7280"}}>{dias} dias · proporcional às horas</p></div>

                  </div>
                </div>
                {pago?<div style={{background:"#dcfce7",borderRadius:10,padding:"8px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>

                    </button>
                  </div>
                </div>}
              </div>
            );
          })}
          <div style={{...C.card,background:"#f0fdf4",border:"1px solid #bbf7d0"}}>

            <select value={novaPass.promotora} onChange={e=>setNovaPass(f=>({...f,promotora:e.target.value}))} style={{...C.inp,marginTop:6,marginBottom:12}}>
              <option value="">Selecione...</option>
              {proms.map(p=><option key={p._k}>{p.nome}</option>)}
            </select>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              <div><label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>De</label>
                <input type="date" value={novaPass.dataInicio} onChange={e=>setNovaPass(f=>({...f,dataInicio:e.target.value}))} style={{...C.inp,marginTop:6}}/></div>
              <div><label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Até</label>
                <input type="date" value={novaPass.dataFim} onChange={e=>setNovaPass(f=>({...f,dataFim:e.target.value}))} style={{...C.inp,marginTop:6}}/></div>
            </div>
            <label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Valor (R$)</label>
            <input type="number" min="0" placeholder="0,00" value={novaPass.valor} onChange={e=>setNovaPass(f=>({...f,valor:e.target.value}))} style={{...C.inp,marginTop:6,marginBottom:12}}/>
            <label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Observação</label>
            <input placeholder="Ex: Passagem ida e volta" value={novaPass.obs} onChange={e=>setNovaPass(f=>({...f,obs:e.target.value}))} style={{...C.inp,marginTop:6,marginBottom:12}}/>
            <label style={{display:"block",border:"2px dashed #e5e7eb",borderRadius:10,padding:"10px 14px",fontSize:13,color:"#6b7280",cursor:"pointer",textAlign:"center",marginBottom:12}}>
              {pdfPass?`📄 ${pdfPass.name}`:"📎 Comprovante PDF (opcional)"}
              <input type="file" accept=".pdf,application/pdf" style={{display:"none"}} onChange={e=>setPdfPass(e.target.files[0])}/>
            </label>
            <button onClick={regPass} disabled={!novaPass.promotora||!novaPass.dataInicio||!novaPass.dataFim||!novaPass.valor||salvandoPass}
              style={{...C.btn,opacity:(!novaPass.promotora||!novaPass.dataInicio||!novaPass.dataFim||!novaPass.valor||salvandoPass)?0.4:1}}>
              {salvandoPass?"Salvando...":"✓ Registrar passagem"}
            </button>
          </div>
          {passagens.length>0&&<><p style={{fontWeight:700,fontSize:15,color:"#1f2937",marginBottom:8}}>Histórico</p>
            {passagens.map(p=>(
              <div key={p._k} style={{...C.card,borderLeft:"4px solid #0ea5e9"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <p style={{fontWeight:700,color:"#1f2937"}}>{p.promotora}</p>
                    <p style={{fontSize:13,color:"#0ea5e9",fontWeight:600}}>🚌 {fmtDate(p.dataInicio)} a {fmtDate(p.dataFim)}</p>
                    <p style={{fontSize:22,fontWeight:700,color:"#0ea5e9",marginTop:4}}>R$ {(p.valor||0).toFixed(2).replace(".",",")}</p>
                    {p.obs&&<p style={{fontSize:12,color:"#6b7280",marginTop:2}}>{p.obs}</p>}
                    <p style={{fontSize:11,color:"#9ca3af",marginTop:4}}>{fmtTS(p.ts)}</p>
                  </div>
                  <div style={{textAlign:"right"}}>
                    {p.comprovante&&<a href={p.comprovante} download="passagem.pdf" style={{fontSize:12,color:"#0ea5e9",fontWeight:700,textDecoration:"none",display:"block",marginBottom:8}}>📄 Baixar</a>}
                    <button onClick={async()=>{if(!window.confirm("Remover?"))return;await fb.remove(`passagens/${p._k}`);}} style={{fontSize:12,background:"none",border:"none",color:"#ef4444",cursor:"pointer"}}>🗑️</button>
                  </div>
                </div>
              </div>
            ))}
          </>}
        </>}

        {tab==="relatorio"&&<>
          <p style={{fontWeight:700,fontSize:18,color:"#1f2937",marginBottom:12}}>Gerar Relatório</p>
          <div style={{...C.card,marginBottom:12}}>
            <p style={{fontWeight:600,color:"#1f2937",marginBottom:4}}>Por mês</p>
            <input type="month" value={mesRef} onChange={e=>setMesRef(e.target.value)} style={{...C.inp2,width:"100%",marginBottom:12}}/>
            <button onClick={()=>printRel("mes")} style={C.btn}>🖨️ Gerar — {mesRef.split("-")[1]}/{mesRef.split("-")[0]}</button>
          </div>
          <div style={C.card}>
            <p style={{fontWeight:600,color:"#1f2937",marginBottom:4}}>Relatório geral</p>
            <button onClick={()=>printRel("geral")} style={{...C.btn,background:"linear-gradient(135deg,#4a148c,#880e4f)"}}>🖨️ Relatório geral</button>
          </div>
        </>}

        {tab==="editar"&&<>
          <p style={{fontWeight:700,fontSize:18,color:"#1f2937",marginBottom:4}}>✏️ Editar lançamentos</p>
          {editReg?(
            <div style={C.card}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <div><p style={{fontWeight:700,color:"#1f2937"}}>{editReg.promotora}</p><p style={{fontSize:13,color:"#6b7280"}}>{editReg.loja}</p></div>
                <button onClick={()=>setEditReg(null)} style={{background:"none",border:"none",color:"#9ca3af",fontSize:20,cursor:"pointer"}}>✕</button>
              </div>
              <label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Data</label>
              <input type="date" value={editForm.data||""} onChange={e=>setEditForm(f=>({...f,data:e.target.value}))} style={{...C.inp,marginTop:6,marginBottom:12}}/>
              <label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Loja</label>
              <select value={editForm.loja||""} onChange={e=>setEditForm(f=>({...f,loja:e.target.value}))} style={{...C.inp,marginTop:6,marginBottom:12}}>
                {LOJAS.map(l=><option key={l}>{l}</option>)}
              </select>
              {editReg.tipo==="venda"&&<>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
                  <div><label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Entrada</label>
                    <input type="time" value={editForm.entrada||""} onChange={e=>setEditForm(f=>({...f,entrada:e.target.value}))} style={{...C.inp,marginTop:6}}/></div>
                  <div><label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Saída almoço</label>
                    <input type="time" value={editForm.saidaAlmoco||""} onChange={e=>setEditForm(f=>({...f,saidaAlmoco:e.target.value}))} style={{...C.inp,marginTop:6}}/></div>
                  <div><label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Volta almoço</label>
                    <input type="time" value={editForm.voltaAlmoco||""} onChange={e=>setEditForm(f=>({...f,voltaAlmoco:e.target.value}))} style={{...C.inp,marginTop:6}}/></div>
                  <div><label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Saída final</label>
                    <input type="time" value={editForm.saidaFinal||""} onChange={e=>setEditForm(f=>({...f,saidaFinal:e.target.value}))} style={{...C.inp,marginTop:6}}/></div>
                </div>
                <label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Total de peças</label>
                <input type="number" min="0" value={editForm.pecas||""} onChange={e=>setEditForm(f=>({...f,pecas:e.target.value}))} style={{...C.inp,marginTop:6,marginBottom:12,fontSize:22,fontWeight:700,textAlign:"center",color:pink}}/>
              </>}
              {editReg.tipo==="falta"&&<>
                <label style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:1}}>Motivo</label>
                <textarea value={editForm.motivo||""} onChange={e=>setEditForm(f=>({...f,motivo:e.target.value}))} style={{...C.inp,marginTop:6,marginBottom:12,minHeight:80,resize:"none"}}/>
              </>}
              <div style={{display:"flex",gap:8,marginTop:4}}>
                <button onClick={async()=>{
                  const upd=editReg.tipo==="venda"
                    ?{data:editForm.data,loja:editForm.loja,entrada:editForm.entrada||"",saidaAlmoco:editForm.saidaAlmoco||"",voltaAlmoco:editForm.voltaAlmoco||"",saidaFinal:editForm.saidaFinal||"",pecas:Number(editForm.pecas||0)}
                    :{data:editForm.data,loja:editForm.loja,motivo:editForm.motivo};
                  await fb.update(`registros/${editReg._k}`,upd);
                  setEditReg(null);
                }} style={{...C.btn,flex:1}}>Salvar</button>
                <button onClick={async()=>{if(!window.confirm("Deletar?"))return;await fb.remove(`registros/${editReg._k}`);setEditReg(null);}} style={{padding:"16px",borderRadius:14,fontWeight:700,fontSize:14,border:"none",cursor:"pointer",color:"#fff",background:"#ef4444",flexShrink:0}}>🗑️</button>
              </div>
            </div>
          ):(
            <>
              <input placeholder="Filtrar por promotora..." value={filtroEdit} onChange={e=>setFiltroEdit(e.target.value)} style={{...C.inp2,width:"100%",marginBottom:12}}/>
              {regs.filter(r=>!filtroEdit||r.promotora?.toLowerCase().includes(filtroEdit.toLowerCase())).sort((a,b)=>(b.data||"").localeCompare(a.data||"")).slice(0,60).map(r=>(
                <div key={r._k} onClick={()=>{setEditReg(r);setEditForm({data:r.data,loja:r.loja,entrada:r.entrada||"",saidaAlmoco:r.saidaAlmoco||"",voltaAlmoco:r.voltaAlmoco||"",saidaFinal:r.saidaFinal||"",pecas:r.pecas||"",motivo:r.motivo||""});}} style={{...C.card,padding:"14px 16px",cursor:"pointer",borderLeft:r.tipo==="falta"?"4px solid #ef4444":"4px solid #e91e8c"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <p style={{fontWeight:700,color:"#1f2937",fontSize:14}}>{r.promotora}</p>
                      <p style={{fontSize:12,color:"#6b7280"}}>{fmtDate(r.data)} · {r.loja}</p>
                      {r.tipo==="falta"&&<p style={{fontSize:11,color:"#ef4444",marginTop:2}}>Falta: {r.motivo}</p>}
                      {r.tipo==="venda"&&r.entrada&&<p style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{fmt(r.entrada)} → {fmt(r.saidaFinal)} · {fmtMin(calcMin(r))}</p>}
                    </div>
                    <div style={{textAlign:"right"}}>
                      {r.tipo==="venda"&&<p style={{fontSize:20,fontWeight:700,color:pink}}>{r.pecas} <span style={{fontSize:11,color:"#9ca3af"}}>peças</span></p>}
                      {r.tipo==="falta"&&<span style={{fontSize:20}}>😷</span>}
                      <p style={{fontSize:11,color:"#d1d5db",marginTop:4}}>✏️</p>
                    </div>
                  </div>
                </div>
              ))}
              {regs.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:"#9ca3af"}}><div style={{fontSize:40,marginBottom:8}}>📭</div><p>Nenhum registro</p></div>}
            </>
          )}
        </>}

        {tab==="config"&&<>
          <p style={{fontWeight:700,fontSize:18,color:"#1f2937",marginBottom:12}}>Gerenciar Promotoras</p>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <input style={{...C.inp2,flex:1}} placeholder="Nome da nova promotora" value={novaP} onChange={e=>setNovaP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addP()}/>
            <button onClick={addP} style={{padding:"10px 16px",borderRadius:12,fontWeight:700,fontSize:14,border:"none",cursor:"pointer",color:"#fff",background:pink}}>+ Add</button>
          </div>
          {proms.map((p,i)=>(
            <div key={p._k} style={{...C.card,display:"flex",alignItems:"center",gap:8,padding:"12px 16px"}}>
              {editIdx===i?<>
                <input style={{...C.inp2,flex:1,fontSize:14}} value={editVal} onChange={e=>setEditVal(e.target.value)} autoFocus/>
                <button onClick={()=>saveEdit(p._k)} style={{background:"none",border:"none",color:"#16a34a",fontWeight:700,fontSize:16,cursor:"pointer"}}>✓</button>
                <button onClick={()=>setEditIdx(null)} style={{background:"none",border:"none",color:"#9ca3af",fontSize:16,cursor:"pointer"}}>✕</button>
              </>:<>
                <div style={{flex:1}}>
                  <p style={{fontWeight:500,color:"#1f2937"}}>{p.nome}</p>
                  <p style={{fontSize:11,color:senhas[nomesKey(p.nome)]?"#16a34a":"#f59e0b"}}>{senhas[nomesKey(p.nome)]?"✓ Senha cadastrada":"⚠ Sem senha"}</p>
                </div>
                <button onClick={()=>{setEditIdx(i);setEditVal(p.nome);}} style={{background:"none",border:"none",fontSize:16,cursor:"pointer"}}>✏️</button>
                <button onClick={()=>removeP(p._k,p.nome)} style={{background:"none",border:"none",fontSize:16,cursor:"pointer"}}>🗑️</button>
              </>}
            </div>
          ))}
          <div style={{background:"#fef3c7",border:"1px solid #fde68a",borderRadius:12,padding:12,fontSize:12,color:"#92400e",marginTop:8}}>
            Promotoras adicionadas aparecem para todas automaticamente!
          </div>
          <button onClick={onLogout} style={{...C.btn,background:"none",border:"2px solid #e5e7eb",color:"#6b7280",marginTop:16}}>Sair do painel</button>
        </>}

      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// SENHA GESTORA
// ═══════════════════════════════════════════════════════════
function TelaSenha({onOk}) {
  const [s,setS] = React.useState("");
  const [err,setErr] = React.useState(false);
  const ok = () => { if(s===SENHA_GESTORA) onOk(); else{setErr(true);setS("");} };
  return(
    <div style={{minHeight:"100vh",background:grad,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:"#fff",borderRadius:24,padding:32,maxWidth:320,width:"100%",textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:12}}>🔐</div>
        <h2 style={{fontSize:22,fontWeight:700,color:"#1f2937",marginBottom:4}}>Painel da Gestora</h2>
        <p style={{fontSize:13,color:"#9ca3af",marginBottom:24}}>Digite a senha para entrar</p>
        <input type="password" placeholder="Senha" value={s} onChange={e=>{setS(e.target.value);setErr(false);}} onKeyDown={e=>e.key==="Enter"&&ok()}
          style={{width:"100%",border:err?"2px solid #ef4444":"2px solid #e5e7eb",borderRadius:12,padding:"14px 16px",fontSize:18,textAlign:"center",outline:"none",marginBottom:8,letterSpacing:4}}/>
        {err&&<p style={{color:"#ef4444",fontSize:13,marginBottom:8}}>Senha incorreta.</p>}
        <button onClick={ok} style={{...C.btn,marginTop:8}}>Entrar</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════
function App() {
  const [modo,setModo] = React.useState("home");
  const [senhaOk,setSenhaOk] = React.useState(false);
  const [promotora,setPromotora] = React.useState(null);
  const [ready,setReady] = React.useState(false);

  React.useEffect(()=>{
    const t=setInterval(()=>{if(window._fb){setReady(true);clearInterval(t);}},100);
    return ()=>clearInterval(t);
  },[]);

  if(!ready) return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:grad}}>
      <div style={{textAlign:"center",color:"#fff"}}><Icone size={64}/><p style={{marginTop:16,fontSize:16}}>Conectando...</p></div>
    </div>
  );

  if(modo==="promotora"){
    if(!promotora) return <LoginPromotora onLogin={n=>setPromotora(n)}/>;
    return <TelaPromotora promotora={promotora} onLogout={()=>{setPromotora(null);setModo("home");}}/>;
  }
  if(modo==="dashboard"){
    if(!senhaOk) return <TelaSenha onOk={()=>setSenhaOk(true)}/>;
    return <Dashboard onLogout={()=>{setModo("home");setSenhaOk(false);}}/>;
  }

  return(
    <div style={{minHeight:"100vh",background:grad,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{textAlign:"center",marginBottom:40}}>
        <Icone size={80}/>
        <h1 style={{fontSize:28,fontWeight:700,color:"#fff",marginTop:16}}>Vendas Promotoras</h1>
        <p style={{color:"#fce4ec",marginTop:6,fontSize:14}}>Controle diário de vendas</p>
      </div>
      <div style={{width:"100%",maxWidth:320,display:"flex",flexDirection:"column",gap:16}}>
        <button onClick={()=>setModo("promotora")} style={{padding:"20px 24px",borderRadius:20,fontWeight:700,fontSize:17,border:"none",cursor:"pointer",color:dark,background:"#fff",boxShadow:"0 8px 32px rgba(136,14,79,0.25)",textAlign:"center"}}>
          👩 Sou Promotora
          <div style={{fontSize:12,fontWeight:400,color:"#9ca3af",marginTop:4}}>Lançar ponto e vendas</div>
        </button>
        <button onClick={()=>setModo("dashboard")} style={{padding:"20px 24px",borderRadius:20,fontWeight:700,fontSize:17,border:"2px solid rgba(255,255,255,0.5)",cursor:"pointer",color:"#fff",background:"rgba(255,255,255,0.15)",textAlign:"center"}}>
          📊 Painel da Gestora
          <div style={{fontSize:12,fontWeight:400,color:"#fce4ec",marginTop:4}}>Ver relatórios e rankings</div>
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
