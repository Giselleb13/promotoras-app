<script>
const FB_URL="https://promotoras-app-default-rtdb.firebaseio.com";
const fb={
  get:async p=>{try{const r=await fetch(FB_URL+"/"+p+".json");return r.ok?await r.json():null}catch(e){return null}},
  set:async(p,v)=>{await fetch(FB_URL+"/"+p+".json",{method:"PUT",body:JSON.stringify(v),headers:{"Content-Type":"application/json"}})},
  push:async(p,v)=>{const r=await fetch(FB_URL+"/"+p+".json",{method:"POST",body:JSON.stringify(v),headers:{"Content-Type":"application/json"}});const j=await r.json();return j.name},
  remove:async p=>{await fetch(FB_URL+"/"+p+".json",{method:"DELETE"})},
  update:async(p,v)=>{await fetch(FB_URL+"/"+p+".json",{method:"PATCH",body:JSON.stringify(v),headers:{"Content-Type":"application/json"}})},
  on:(p,cb)=>{let last=null;const poll=async()=>{try{const r=await fetch(FB_URL+"/"+p+".json");if(!r.ok)return;const v=await r.json();const s=JSON.stringify(v);if(s!==last){last=s;cb(v)}}catch(e){}};poll();const id=setInterval(poll,3000);return()=>clearInterval(id)}
};

const SENHA="092430";
const LOJAS=["Nab Centro","Nab MDS","Nab Ário","Nab Polo","Nab Boituva","Origami SMT","Origami Cecap","Japonesa","Charm","Depósito 23","Villa","Gota de Sol 80"];
const PROMS_DEF=["Nede","Nely","Priscila","Darlane","Thaís Piracicaba","Fernanda Piracicaba","Ana Boituva","Thaís Indaiatuba","Tatiaria"];
const TIPOS=["Produto com vencimento próximo","Solicitar sachês","Solicitar brindes","Informação importante","Outro"];
const JORNADA=480;
const pink="#e91e8c",dark="#880e4f",grad="linear-gradient(135deg,#880e4f,#e91e8c)";

function todayBR(){const d=new Date(),br=new Date(d.toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));return br.getFullYear()+"-"+p2(br.getMonth()+1)+"-"+p2(br.getDate())}
function nowBR(){const d=new Date(),br=new Date(d.toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));return p2(br.getHours())+":"+p2(br.getMinutes())}
function p2(n){return String(n).padStart(2,"0")}
function fmtDate(d){if(!d)return"";const[y,m,dd]=d.split("-");return dd+"/"+m+"/"+y}
function fmtTS(ts){if(!ts)return"";const d=new Date(ts);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function toMin(t){if(!t)return 0;const[h,m]=t.split(":").map(Number);return h*60+m}
function calcMin(r){if(!r||!r.entrada||!r.saidaFinal)return 0;return Math.max(0,toMin(r.saidaFinal)-toMin(r.entrada))}
function fmtMin(m){return Math.floor(m/60)+"h"+p2(m%60)}
function fmt(t){return t?t.slice(0,5):"--"}
function isSabado(data){if(!data)return false;return new Date(data+"T12:00:00").getDay()===6}
function jornadaMin(prom){const j=S&&S.valD?S.valD[nk(prom)+"_jornada"]:null;if(!j)return JORNADA;return Math.max(1,toMin(j.saida)-toMin(j.entrada))}
function getQ(d){const[y,mo,dd]=d.split("-");return+dd<=15?y+"-"+mo+"-01":y+"-"+mo+"-16"}
function fimQ(q){const[y,mo,dd]=q.split("-");const u=new Date(+y,+mo,0).getDate();return dd==="01"?y+"-"+mo+"-15":y+"-"+mo+"-"+u}
function lblQ(q){const[y,mo,dd]=q.split("-");const u=new Date(+y,+mo,0).getDate();return(dd==="01"?"1-15/":"16-"+u+"/")+mo+"/"+y}
function nk(n){return n.replace(/\s+/g,"_")}

function el(tag,attrs,children){
  const e=document.createElement(tag);
  if(attrs){for(const[k,v]of Object.entries(attrs)){
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }}
  if(children!=null){
    (Array.isArray(children)?children.flat(9):[children]).forEach(c=>{
      if(c==null||c===false)return;
      e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
    });
  }
  return e;
}
function dv(st,ch){return el("div",{style:st||{}},ch)}
function pt(st,tx){return el("p",{style:st||{}},tx)}
function btn(tx,fn,ex){return el("button",{onClick:fn,style:{width:"100%",padding:"16px",borderRadius:"14px",fontWeight:"700",fontSize:"16px",border:"none",color:"#fff",background:grad,...(ex||{})}},[tx])}
function inp(at,ex){return el("input",{...at,style:{width:"100%",border:"2px solid #e5e7eb",borderRadius:"12px",padding:"12px 16px",fontSize:"16px",outline:"none",background:"#fff",...(ex||{})}})}
function lbl(tx){return el("label",{style:{fontSize:"11px",fontWeight:"700",color:"#6b7280",textTransform:"uppercase",letterSpacing:"1px",display:"block",marginBottom:"4px",marginTop:"12px"}},[tx])}
function card(ex,ch){return dv({background:"#fff",borderRadius:"20px",padding:"20px",boxShadow:"0 2px 16px rgba(0,0,0,0.08)",marginBottom:"12px",...(ex||{})},ch)}
function mkSel(opts,ph,val,fn){
  const s=el("select",{onChange:e=>fn(e.target.value),style:{width:"100%",border:"2px solid #e5e7eb",borderRadius:"12px",padding:"12px 16px",fontSize:"16px",outline:"none",background:"#fff",WebkitAppearance:"none"}});
  if(ph)s.appendChild(el("option",{value:""},[ph]));
  opts.forEach(o=>{const op=el("option",{value:o},[o]);if(o===val)op.selected=true;s.appendChild(op)});
  return s;
}
function stCard(val,label,color){return card({textAlign:"center",marginBottom:"0",padding:"14px"},[pt({fontSize:"26px",fontWeight:"700",color},String(val)),pt({fontSize:"11px",color:"#9ca3af"},label)])}
function hdr(title,sub,onBack){
  return dv({padding:"32px 20px 20px",background:grad},[
    onBack?el("button",{onClick:onBack,style:{background:"none",border:"none",color:"#f9a8d4",fontWeight:"600",fontSize:"14px",marginBottom:"8px",padding:"0",display:"block"}},["← Voltar"]):null,
    el("h1",{style:{color:"#fff",fontSize:"22px",fontWeight:"700"}},[title]),
    sub?pt({color:"#f9a8d4",fontSize:"13px",marginTop:"2px"},sub):null
  ]);
}

const S={
  modo:"home",prom:null,
  step:"menu",loja:"",lojaF:"",motivoF:"",tipoS:"",descS:"",
  mesH:todayBR().slice(0,7),pecasI:"",editP:false,
  dashOk:false,tab:"hoje",dashMes:todayBR().slice(0,7),det:null,
  novaP:"",eidx:null,eval_:"",resp:{},qSel:getQ(todayBR()),
  nVal:{},pdfs:{},sP:{},sPas:false,
  nPass:{pr:"",di:"",df:"",val:"",obs:"",_pdf:null},
  eReg:null,eForm:{},filt:"",detPag:null,
  aForm:{ap:"",ad:"",al:"",ae:"",asa:"",ava:"",asf:"",ape:""},
  proms:[],senhas:{},regs:[],solics:[],pagtos:[],passes:[],valD:{},
  _unsubs:[]
};

function ss(patch){Object.assign(S,patch);render()}

function startListeners(){
  S._unsubs.forEach(u=>u());S._unsubs=[];
  const li=(path,setter)=>S._unsubs.push(fb.on(path,val=>{setter(val);render()}));
  li("promotoras",v=>S.proms=v?Object.entries(v).map(([k,n])=>({_k:k,nome:n})):[]);
  li("senhas",v=>S.senhas=v||{});
  li("registros",v=>S.regs=v?Object.entries(v).map(([k,r])=>({...r,_k:k})):[]);
  li("solicitacoes",v=>S.solics=v?Object.entries(v).map(([k,r])=>({...r,_k:k})).sort((a,b)=>b.ts-a.ts):[]);
  li("pagamentos",v=>S.pagtos=v?Object.entries(v).map(([k,r])=>({...r,_k:k})):[]);
  li("passagens",v=>S.passes=v?Object.entries(v).map(([k,r])=>({...r,_k:k})).sort((a,b)=>(b.ts||0)-(a.ts||0)):[]);
  li("valoresDiarios",v=>S.valD=v||{});
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  app.appendChild(S.modo==="home"?pgHome():S.modo==="prom"?pgProm():pgDash());
}

function pgHome(){
  return dv({minHeight:"100vh",background:grad,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px"},[
    dv({textAlign:"center",marginBottom:"40px"},[dv({fontSize:"64px",marginBottom:"12px"},"🧴"),el("h1",{style:{fontSize:"28px",fontWeight:"700",color:"#fff"}},["Vendas Promotoras"]),pt({color:"#fce4ec",marginTop:"6px",fontSize:"14px"},"Bendita Maria Cosméticos")]),

      el("button",{onClick:()=>ss({modo:"dash",dashOk:false}),style:{padding:"20px 24px",borderRadius:"20px",fontWeight:"700",fontSize:"17px",border:"2px solid rgba(255,255,255,0.5)",color:"#fff",background:"rgba(255,255,255,0.15)",textAlign:"center"}},["📊 Painel da Gestora",dv({fontSize:"12px",fontWeight:"400",color:"#fce4ec",marginTop:"4px"},"Ver relatórios e rankings")])
    ])
  ]);

function pgProm(){
  if(S.step==="login"||!S.prom)return pgLogin();
  const pages={menu:pgMenu,loja:pgLoja,ponto:pgPonto,falta:pgFalta,okF:pgOkF,solic:pgSolic,okS:pgOkS,hist:pgHist,pag:pgPag,pass:pgPass};

}

function pgLogin(){
  const wrap=dv({minHeight:"100vh",background:"linear-gradient(135deg,#fce4ec,#f8bbd0)",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"});
  const box=card({maxWidth:"360px",width:"100%",padding:"32px"});
  wrap.appendChild(box);
  function showMain(){
    box.innerHTML="";
    box.appendChild(dv({textAlign:"center",marginBottom:"24px"},[dv({fontSize:"56px",marginBottom:"8px"},"🧴"),el("h1",{style:{fontSize:"24px",fontWeight:"700",color:"#1f2937"}},["Lançar Vendas"]),pt({color:"#6b7280",fontSize:"13px",marginTop:"4px"},new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"}))]));
    box.appendChild(lbl("Qual é o seu nome?"));
    const sl=mkSel(S.proms.map(p=>p.nome),"Selecione seu nome...","",()=>{});
    box.appendChild(sl);
    box.appendChild(dv({marginTop:"16px"},btn("Continuar →",async()=>{
      const nome=sl.value;if(!nome)return;
      const s=await fb.get("senhas/"+nk(nome));
      if(s)showSenha(nome,s);else showCad(nome);
    })));
    if(S.proms.length===0)fb.get("promotoras").then(v=>{if(!v)PROMS_DEF.forEach(p=>fb.push("promotoras",p))});
  }
  function showSenha(nome,sc){
    box.innerHTML="";
    box.appendChild(dv({textAlign:"center",marginBottom:"24px"},[dv({fontSize:"48px",marginBottom:"8px"},"👋"),el("h2",{style:{fontSize:"20px",fontWeight:"700",color:"#1f2937"}},["Olá, "+nome+"!"]),pt({fontSize:"13px",color:"#6b7280",marginTop:"4px"},"Digite sua senha de 4 números")]));
    const si=inp({type:"password",inputMode:"numeric",maxLength:"4",placeholder:"0000"},{textAlign:"center",fontSize:"28px",letterSpacing:"10px",marginBottom:"8px"});
    const er=pt({color:"#ef4444",fontSize:"13px",textAlign:"center",display:"none"},"Senha incorreta.");
    const bE=btn("Entrar",()=>{if(si.value===sc){S.prom=nome;ss({step:"menu"})}else{er.style.display="block";si.value=""}});
    si.addEventListener("keydown",e=>{if(e.key==="Enter")bE.click()});
    box.appendChild(si);box.appendChild(er);box.appendChild(bE);
    box.appendChild(btn("← Voltar",showMain,{background:"none",color:"#9ca3af",marginTop:"8px"}));
  }
  function showCad(nome){
    box.innerHTML="";
    box.appendChild(dv({textAlign:"center",marginBottom:"24px"},[dv({fontSize:"48px",marginBottom:"8px"},"🔐"),el("h2",{style:{fontSize:"20px",fontWeight:"700",color:"#1f2937"}},["Criar senha"]),pt({fontSize:"13px",color:"#6b7280",marginTop:"4px"},"Olá "+nome+"! Crie sua senha de 4 números.")]));
    const n1=inp({type:"password",inputMode:"numeric",maxLength:"4",placeholder:"0000"},{textAlign:"center",fontSize:"24px",letterSpacing:"8px",marginBottom:"4px"});
    const n2=inp({type:"password",inputMode:"numeric",maxLength:"4",placeholder:"0000"},{textAlign:"center",fontSize:"24px",letterSpacing:"8px",marginBottom:"8px"});
    const er=pt({color:"#ef4444",fontSize:"13px",textAlign:"center",display:"none"},"");
    box.appendChild(lbl("Nova senha"));box.appendChild(n1);
    box.appendChild(lbl("Confirmar"));box.appendChild(n2);box.appendChild(er);
    box.appendChild(btn("Criar senha e entrar",async()=>{
      if(n1.value.length!==4||!/^\d+$/.test(n1.value)){er.textContent="Deve ter 4 números.";er.style.display="block";return}
      if(n1.value!==n2.value){er.textContent="Senhas não coincidem.";er.style.display="block";return}
      await fb.set("senhas/"+nk(nome),n1.value);S.prom=nome;ss({step:"menu"});
    }));
  }
  showMain();
  return wrap;
}

  const vH=S.regs.filter(r=>r.promotora===S.prom&&r.data===todayBR()&&r.tipo==="venda").length;

function pgPonto(){
  const prm=S.prom,loja=S.loja;
  const reg=S.regs.find(r=>r.promotora===prm&&r.loja===loja&&r.data===todayBR()&&r.tipo==="venda");
  const mins=calcMin(reg),pct=reg&&reg.saidaFinal?Math.min(100,mins/JORNADA*100):0;
  if(!S._saving)S._saving={};
  const lancar=async campo=>{
    // Tripla proteção contra duplicatas
    if(S._saving&&S._saving[campo])return;
    // Verifica no Firebase se já existe antes de salvar
    const regAtual=S.regs.find(r=>r.promotora===prm&&r.loja===loja&&r.data===todayBR()&&r.tipo==="venda");
    if(regAtual&&regAtual[campo])return; // já foi registrado, ignora
    S._saving[campo]=true;
    render();
    try{
      const h=nowBR();
      if(regAtual&&regAtual._k)await fb.update("registros/"+regAtual._k,{[campo]:h});
      else{
        // Verifica uma última vez no Firebase antes de criar novo registro
        const existente=await fb.get("registros");
        const jaExiste=existente&&Object.values(existente).find(r=>r.promotora===prm&&r.data===todayBR()&&r.tipo==="venda"&&r[campo]);
        if(!jaExiste){
          // Busca o _k existente para atualizar ao invés de criar novo
          const regExistente=existente&&Object.entries(existente).find(([k,r])=>r.promotora===prm&&r.data===todayBR()&&r.tipo==="venda");
          if(regExistente)await fb.update("registros/"+regExistente[0],{[campo]:h});
          else await fb.push("registros",{promotora:prm,loja,data:todayBR(),tipo:"venda",[campo]:h,pecas:0,ts:Date.now()});
        }
      }
    }catch(e){}
    S._saving[campo]=false;
    render();
  };
  const salvarPecas=async v=>{
    if(!v)return;
    if(reg&&reg._k)await fb.update("registros/"+reg._k,{pecas:+v});
    else await fb.push("registros",{promotora:prm,loja,data:todayBR(),tipo:"venda",pecas:+v,ts:Date.now()});
    ss({editP:false});
  };
  let pecasEl;
  if(S.editP||!(reg&&reg.pecas)){
    const pi=inp({type:"number",min:"0",placeholder:"0",value:S.pecasI},{fontSize:"22px",fontWeight:"700",textAlign:"center",color:pink,flex:"1"});
    pi.addEventListener("input",e=>S.pecasI=e.target.value);
    pecasEl=dv({display:"flex",gap:"8px",marginTop:"8px"},[pi,el("button",{onClick:()=>salvarPecas(S.pecasI||pi.value),style:{padding:"12px 16px",borderRadius:"12px",fontWeight:"700",fontSize:"14px",border:"none",color:"#fff",background:"#16a34a"}},["✓"])]);
  }else{
    pecasEl=dv({display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:"8px"},[
      pt({fontSize:"32px",fontWeight:"700",color:pink},reg.pecas+" peças"),
      el("button",{onClick:()=>ss({editP:true,pecasI:String(reg.pecas)}),style:{fontSize:"13px",color:"#6b7280",background:"none",border:"1px solid #e5e7eb",borderRadius:"8px",padding:"6px 12px"}},["✏️"])
    ]);
  }
  const pontos=[["entrada","Entrada","🟢"],["saidaAlmoco","Saída almoço","🍽️"],["voltaAlmoco","Volta almoço","🔄"],["saidaFinal","Saída final","🔴"]];
  return dv({minHeight:"100vh",background:"#f9f4f7"},[
    dv({padding:"28px 20px 20px",background:grad},[
      el("button",{onClick:()=>ss({step:"loja"}),style:{background:"none",border:"none",color:"#f9a8d4",fontWeight:"600",fontSize:"14px",marginBottom:"8px",padding:"0",display:"block"}},["← Voltar"]),
      pt({color:"#f9a8d4",fontSize:"11px",fontWeight:"700",textTransform:"uppercase",letterSpacing:"1px"},"Ponto do dia"),

          ]));
          return cDiv;
        })
      ]);
    }
    content=dv({},[pt({fontWeight:"700",fontSize:"18px",color:"#1f2937",marginBottom:"4px"},"✏️ Editar / Adicionar"),addSec,valSec,listSec]);
  }else if(tab==="cfg"){
    const ni=inp({placeholder:"Nome da nova promotora",value:S.novaP},{});
    ni.addEventListener("input",e=>S.novaP=e.target.value);
    ni.addEventListener("keydown",async e=>{if(e.key==="Enter"&&S.novaP.trim()){await fb.push("promotoras",S.novaP.trim());S.novaP="";render()}});

      pt({fontWeight:"700",fontSize:"18px",color:"#1f2937",marginBottom:"12px"},"Gerenciar Promotoras"),

        pt({fontSize:"12px",color:"#0369a1",marginBottom:"12px"},"Define entrada e saída de cada uma. Sábado sempre vale diária completa. Almoço não desconta."),
        ...S.proms.map(({nome:n})=>{
          const j=S.valD[nk(n)+"_jornada"]||{entrada:"09:00",saida:"17:00"};
          const eI=inp({type:"time",value:j.entrada},{width:"auto",flex:"1"});
          const sI=inp({type:"time",value:j.saida},{width:"auto",flex:"1"});
          eI.addEventListener("change",async e=>{const cur=S.valD[nk(n)+"_jornada"]||{};await fb.set("valoresDiarios/"+nk(n)+"_jornada",{...cur,entrada:e.target.value});});
          sI.addEventListener("change",async e=>{const cur=S.valD[nk(n)+"_jornada"]||{};await fb.set("valoresDiarios/"+nk(n)+"_jornada",{...cur,saida:e.target.value});});
          return dv({marginBottom:"12px"},[
            pt({fontSize:"13px",fontWeight:"700",color:"#1f2937",marginBottom:"4px"},n),
            dv({display:"flex",gap:"8px",alignItems:"center"},[

      dv({display:"flex",gap:"8px",marginBottom:"12px"},[ni,el("button",{onClick:async()=>{if(!S.novaP.trim())return;await fb.push("promotoras",S.novaP.trim());S.novaP="";render()},style:{padding:"10px 16px",borderRadius:"12px",fontWeight:"700",fontSize:"14px",border:"none",color:"#fff",background:pink}},["+ Add"])]),
      ...S.proms.map((prm,i)=>{
        if(S.eidx===i){
          const ei=inp({value:S.eval_},{});ei.addEventListener("input",e=>S.eval_=e.target.value);setTimeout(()=>ei.focus(),50);
          return card({display:"flex",alignItems:"center",gap:"8px",padding:"12px 16px"},[ei,el("button",{onClick:async()=>{await fb.set("promotoras/"+prm._k,S.eval_);ss({eidx:null})},style:{background:"none",border:"none",color:"#16a34a",fontWeight:"700",fontSize:"16px",cursor:"pointer"}},["✓"]),el("button",{onClick:()=>ss({eidx:null}),style:{background:"none",border:"none",color:"#9ca3af",fontSize:"16px",cursor:"pointer"}},["✕"])]);
        }
        return card({display:"flex",alignItems:"center",gap:"8px",padding:"12px 16px"},[
          dv({flex:"1"},[pt({fontWeight:"500",color:"#1f2937"},prm.nome),pt({fontSize:"11px",color:S.senhas[nk(prm.nome)]?"#16a34a":"#f59e0b"},S.senhas[nk(prm.nome)]?"✓ Senha cadastrada":"⚠ Sem senha")]),
          el("button",{onClick:()=>ss({eidx:i,eval_:prm.nome}),style:{background:"none",border:"none",fontSize:"16px",cursor:"pointer"}},["✏️"]),

      dv({marginTop:"16px"},btn("Sair do painel",()=>ss({modo:"home",dashOk:false}),{background:"none",border:"2px solid #e5e7eb",color:"#6b7280"}))

  return dv({minHeight:"100vh",background:"#f9f4f7"},[

    ]),

}

function pgDetPag(){
  const {nome,q}=S.detPag;
  const ini=q,fim=fimQ(q);
  const regsQ=S.regs.filter(r=>r.promotora&&r.promotora.trim().toLowerCase()===nome.trim().toLowerCase()&&r.tipo==="venda"&&r.data>=ini&&r.data<=fim).sort((a,b)=>a.data.localeCompare(b.data));
  const vd=S.valD[nk(nome)]||0;
  const isSab=(data)=>new Date(data+"T12:00:00").getDay()===6;
  const jorn=()=>{const j=S.valD[nk(nome)+"_jornada"];if(!j)return JORNADA;return toMin(j.saida)-toMin(j.entrada)};
  const calcValDia=(r)=>{if(isSab(r.data))return vd;const m=calcMin(r);return vd*(m===0?1:Math.min(1,m/jorn()))};
  const total=regsQ.reduce((s,r)=>s+calcValDia(r),0);

  // Add day form
  let novaData="",novaLoja="",novaE="",novaS="",novaPecas="";
  const dI=inp({type:"date",value:""},{}); dI.addEventListener("change",e=>novaData=e.target.value);
  const slL=mkSel(LOJAS,"Selecione loja...","",(v)=>novaLoja=v);
  const eI=inp({type:"time",value:""},{}); eI.addEventListener("change",e=>novaE=e.target.value);
  const sI=inp({type:"time",value:""},{}); sI.addEventListener("change",e=>novaS=e.target.value);
  const pI=inp({type:"number",min:"0",placeholder:"0"},{fontSize:"18px",fontWeight:"700",textAlign:"center",color:pink}); pI.addEventListener("input",e=>novaPecas=e.target.value);

  return dv({minHeight:"100vh",background:"#f9f4f7"},[
    dv({padding:"28px 20px 20px",background:grad},[
      el("button",{onClick:()=>ss({detPag:null}),style:{background:"none",border:"none",color:"#f9a8d4",fontWeight:"600",fontSize:"14px",marginBottom:"8px",padding:"0",display:"block"}},["← Voltar"]),
      el("h1",{style:{color:"#fff",fontSize:"20px",fontWeight:"700"}},[nome]),
      pt({color:"#f9a8d4",fontSize:"13px",marginTop:"2px"},lblQ(q)+" · R$ "+total.toFixed(2).replace(".",",")),
    ]),
    dv({padding:"16px"},[
      // Days list
      regsQ.length===0?dv({textAlign:"center",padding:"20px 0",color:"#9ca3af"},[pt({},"Nenhum dia lançado nesta quinzena")]):null,
      ...regsQ.map(r=>{
        const val=calcValDia(r);
        const mins=calcMin(r);
        return card({borderLeft:isSab(r.data)?"4px solid #7c3aed":"4px solid #e91e8c",padding:"14px 16px"},[
          dv({display:"flex",justifyContent:"space-between",alignItems:"center"},[
            dv({},[
              pt({fontWeight:"700",color:"#1f2937",fontSize:"14px"},fmtDate(r.data)+(isSab(r.data)?" 🟣 Sábado":"")),
              pt({fontSize:"12px",color:"#6b7280"},r.loja),
              pt({fontSize:"11px",color:"#9ca3af"},fmt(r.entrada)+"→"+fmt(r.saidaFinal)+(mins?" · "+fmtMin(mins):"")),
            ]),
            dv({textAlign:"right"},[
              pt({fontSize:"16px",fontWeight:"700",color:"#16a34a"},"R$ "+val.toFixed(2).replace(".",",")),
              pt({fontSize:"20px",color:pink},r.pecas+" peças")
            ])
          ])
        ]);
      }),
      // Divider
      dv({borderTop:"2px dashed #e5e7eb",margin:"8px 0 16px"}),
      // Add day
      card({border:"2px solid #e91e8c"},[
        pt({fontWeight:"700",color:"#1f2937",marginBottom:"12px"},"➕ Adicionar dia nesta quinzena"),
        lbl("Data"),dI,
        lbl("Loja"),slL,
        dv({display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginTop:"4px"},[
          dv({},[lbl("Entrada"),eI]),
          dv({},[lbl("Saída"),sI])
        ]),
        lbl("Peças"),pI,
        dv({marginTop:"12px"},btn("➕ Adicionar",async()=>{
          if(!novaData||!novaLoja)return;
          await fb.push("registros",{promotora:nome,loja:novaLoja,data:novaData,tipo:"venda",entrada:novaE||"",saidaFinal:novaS||"",pecas:+(novaPecas||0),ts:Date.now()});
          ss({detPag:{nome,q}});
        }))
      ])
    ])
  ]);
}

function pgDet(){
  const det=S.det,rP=S.regs.filter(r=>r.promotora===det).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const vP=rP.filter(r=>r.tipo==="venda"),fP=rP.filter(r=>r.tipo==="falta");
  const tot=vP.reduce((s,r)=>s+(r.pecas||0),0),dias=[...new Set(vP.map(r=>r.data))].length;
  return dv({minHeight:"100vh",background:"#f9f4f7"},[
    hdr(det,dias+" dias · "+fP.length+" falta"+(fP.length!==1?"s":""),()=>ss({det:null})),
    dv({padding:"16px"},[
      dv({display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px",marginBottom:"12px"},[stCard(tot,"peças total",pink),stCard(dias>0?(tot/dias).toFixed(1):0,"média/dia","#7c3aed")]),
      pt({fontWeight:"700",fontSize:"15px",color:"#1f2937",marginBottom:"8px"},"Histórico"),
      ...(()=>{
        const porDia={};
        rP.forEach(r=>{
          const k=r.data+"_"+r.tipo;
          if(!porDia[k])porDia[k]=r;
          else{const cur=porDia[k];if(!cur.saidaFinal&&r.saidaFinal)porDia[k]=r;else if((r.pecas||0)>(cur.pecas||0))porDia[k]=r;}
        });
        return Object.values(porDia).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
      })().map(r=>card({padding:"14px 16px",borderLeft:r.tipo==="falta"?"4px solid #ef4444":"4px solid #e91e8c"},[
        dv({display:"flex",justifyContent:"space-between",alignItems:"flex-start"},[
          dv({},[pt({fontWeight:"700",color:"#1f2937",fontSize:"14px"},fmtDate(r.data)),pt({fontSize:"13px",color:"#6b7280"},r.loja),r.tipo==="falta"?pt({fontSize:"12px",color:"#ef4444",marginTop:"2px"},"Falta: "+r.motivo):null,r.tipo==="venda"&&r.entrada?pt({fontSize:"11px",color:"#9ca3af",marginTop:"2px"},fmt(r.entrada)+"→"+fmt(r.saidaFinal)+" "+(calcMin(r)?fmtMin(calcMin(r)):"")):null]),
          r.tipo==="venda"?dv({textAlign:"right"},[pt({fontSize:"22px",fontWeight:"700",color:pink},r.pecas),pt({fontSize:"11px",color:"#9ca3af"},"peças")]):el("span",{style:{fontSize:"20px"}},["😷"])
        ])
      ]))
    ])
  ]);
}

function pgSenha(){
  const bi=inp({type:"password",placeholder:"Senha"},{textAlign:"center",fontSize:"18px",letterSpacing:"4px",marginBottom:"8px"});
  const er=pt({color:"#ef4444",fontSize:"13px",textAlign:"center",display:"none"},"Senha incorreta.");
