<!DOCTYPE html>

<head>

<title>Vendas Promotoras</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f9f4f7;-webkit-font-smoothing:antialiased}
input,select,button,textarea{font-family:inherit;font-size:16px}

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>
<script>
firebase.initializeApp({databaseURL:"https://promotoras-app-default-rtdb.firebaseio.com"});
const _db=firebase.database();
window.FB={
  db:_db,
  ref:(db,p)=>_db.ref(p),
  set:(ref,v)=>ref.set(v),
  get:async(ref)=>{const s=await ref.once("value");return{exists:()=>s.exists(),val:()=>s.val()}},
  onValue:(ref,cb)=>{const h=snap=>cb(snap);ref.on("value",h);return()=>ref.off("value",h)},
  push:(ref,v)=>ref.push(v),
  remove:(ref)=>ref.remove(),
  update:(ref,v)=>ref.update(v)
};
// rewrap fb helpers for compat
window.FB2={
  get:async p=>{const s=await _db.ref(p).once("value");return s.exists()?s.val():null},
  set:async(p,v)=>_db.ref(p).set(v),
  push:async(p,v)=>{const r=await _db.ref(p).push(v);return r.key},
  remove:async p=>_db.ref(p).remove(),
  update:async(p,v)=>_db.ref(p).update(v),
  on:(p,cb)=>{const ref=_db.ref(p);const h=snap=>cb(snap.exists()?snap.val():null);ref.on("value",h);return()=>ref.off("value",h)}
};
window.dispatchEvent(new Event("fb_ready"));
</script>
<script>
const SENHA_GESTORA="092430";
const LOJAS=["Nab Centro","Nab MDS","Nab Ário","Nab Polo","Nab Boituva","Origami SMT","Origami Cecap","Japonesa","Charm","Depósito 23","Villa","Gota de Sol 80"];
const PROMS_DEF=["Nede","Nely","Priscila","Darlane","Thaís Piracicaba","Fernanda Piracicaba","Ana Boituva","Thaís Indaiatuba","Tatiaria"];
const TIPOS=["Produto com vencimento próximo","Solicitar sachês","Solicitar brindes","Informação importante","Outro"];
const JORNADA=480;
const pink="#e91e8c",dark="#880e4f",grad="linear-gradient(135deg,#880e4f,#e91e8c)";

// helpers
function todayBR(){const d=new Date(),br=new Date(d.toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));return`${br.getFullYear()}-${String(br.getMonth()+1).padStart(2,"0")}-${String(br.getDate()).padStart(2,"0")}`}
function nowBR(){const d=new Date(),br=new Date(d.toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));return`${String(br.getHours()).padStart(2,"0")}:${String(br.getMinutes()).padStart(2,"0")}`}
function fmtDate(d){if(!d)return"";const[y,m,dd]=d.split("-");return`${dd}/${m}/${y}`}
function fmtTS(ts){if(!ts)return"";const d=new Date(ts);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function toMin(t){if(!t)return 0;const[h,m]=t.split(":").map(Number);return h*60+m}
function calcMin(r){if(!r||!r.entrada||!r.saidaFinal)return 0;let t=toMin(r.saidaFinal)-toMin(r.entrada);if(r.saidaAlmoco&&r.voltaAlmoco)t-=toMin(r.voltaAlmoco)-toMin(r.saidaAlmoco);return Math.max(0,t)}
function fmtMin(m){return`${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}`}
function fmt(t){return t?t.slice(0,5):"--:--"}
function getQ(d){const[y,mo,dd]=d.split("-");return Number(dd)<=15?`${y}-${mo}-01`:`${y}-${mo}-16`}
function fimQ(q){const[y,mo,dd]=q.split("-");const u=new Date(Number(y),Number(mo),0).getDate();return dd==="01"?`${y}-${mo}-15`:`${y}-${mo}-${u}`}
function lblQ(q){const[y,mo,dd]=q.split("-");const u=new Date(Number(y),Number(mo),0).getDate();return dd==="01"?`1-15/${mo}/${y}`:`16-${u}/${mo}/${y}`}
function nk(n){return n.replace(/\s+/g,"_")}
function R(tag,attrs,...kids){const el=document.createElement(tag);if(attrs)Object.entries(attrs).forEach(([k,v])=>{if(k==="style"&&typeof v==="object")Object.assign(el.style,v);else if(k.startsWith("on")&&typeof v==="function")el.addEventListener(k.slice(2).toLowerCase(),v);else if(k==="className")el.className=v;else el.setAttribute(k,v)});kids.flat(Infinity).forEach(c=>{if(c==null||c===false)return;el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c)});return el}

// firebase wrappers - use compat API
const fb={
  get:async p=>window.FB2.get(p),
  set:async(p,v)=>window.FB2.set(p,v),
  push:async(p,v)=>window.FB2.push(p,v),
  remove:async p=>window.FB2.remove(p),
  update:async(p,v)=>window.FB2.update(p,v),
  on:(p,cb)=>window.FB2.on(p,cb)
};

// styles helpers
const S={
  card:(e={})=>({background:"#fff",borderRadius:"20px",padding:"20px",boxShadow:"0 2px 16px rgba(0,0,0,0.08)",marginBottom:"12px",...e}),
  inp:(e={})=>({width:"100%",border:"2px solid #e5e7eb",borderRadius:"12px",padding:"12px 16px",fontSize:"16px",outline:"none",background:"#fff",display:"block",...e}),
  btn:(e={})=>({width:"100%",padding:"16px",borderRadius:"14px",fontWeight:"700",fontSize:"16px",border:"none",color:"#fff",background:grad,display:"block",...e}),
  inp2:(e={})=>({border:"2px solid #e5e7eb",borderRadius:"12px",padding:"10px 14px",fontSize:"14px",outline:"none",background:"#fff",...e}),
  lbl:{fontSize:"11px",fontWeight:"700",color:"#6b7280",textTransform:"uppercase",letterSpacing:"1px",display:"block",marginBottom:"6px"},
};

// STATE
const STATE={
  modo:"home", // home | promotora | dashboard
  promotora:null,
  dashSenhaOk:false,
  // promotora screens
  promStep:"menu", // menu | loja | ponto | falta | okF | solic | okS | hist | pag | pass
  promLoja:"",
  promLojaF:"",
  promMotivoF:"",
  promTipoS:"",
  promDescS:"",
  promMesH:todayBR().slice(0,7),
  promPecasI:"",
  promEditP:false,
  // dashboard
  dashTab:"hoje",
  dashMes:todayBR().slice(0,7),
  dashDet:null,
  dashNovaP:"",
  dashEidx:null,
  dashEval:"",
  dashResp:{},
  dashQSel:getQ(todayBR()),
  dashNVal:{},
  dashPdfs:{},
  dashSP:{},
  dashNPass:{pr:"",di:"",df:"",val:"",obs:""},
  dashSPas:false,
  dashEReg:null,
  dashEForm:{},
  dashFilt:"",
  dashAForm:{ap:"",ad:"",al:"",ae:"",asa:"",ava:"",asf:"",ape:""},
  // data
  proms:[],
  senhas:{},
  regs:[],
  solics:[],
  pagtos:[],
  passes:[],
  valD:{},
  // unsub
  _unsubs:[],
};

function setState(patch){Object.assign(STATE,patch);render()}

// LISTENERS
function startListeners(){
  STATE._unsubs.forEach(u=>u());
  STATE._unsubs=[];
  STATE._unsubs.push(fb.on("promotoras",val=>{STATE.proms=val?Object.entries(val).map(([k,v])=>({_k:k,nome:v})):[];render()}));
  STATE._unsubs.push(fb.on("senhas",val=>{STATE.senhas=val||{};render()}));
  STATE._unsubs.push(fb.on("registros",val=>{STATE.regs=val?Object.entries(val).map(([k,v])=>({...v,_k:k})):[];render()}));
  STATE._unsubs.push(fb.on("solicitacoes",val=>{STATE.solics=val?Object.entries(val).map(([k,v])=>({...v,_k:k})).sort((a,b)=>b.ts-a.ts):[];render()}));
  STATE._unsubs.push(fb.on("pagamentos",val=>{STATE.pagtos=val?Object.entries(val).map(([k,v])=>({...v,_k:k})):[];render()}));
  STATE._unsubs.push(fb.on("passagens",val=>{STATE.passes=val?Object.entries(val).map(([k,v])=>({...v,_k:k})).sort((a,b)=>(b.ts||0)-(a.ts||0)):[];render()}));
  STATE._unsubs.push(fb.on("valoresDiarios",val=>{STATE.valD=val||{};render()}));
}

// RENDER
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  let el;
  if(STATE.modo==="home") el=renderHome();
  else if(STATE.modo==="promotora") el=renderPromotora();
  else if(STATE.modo==="dashboard") el=renderDashboard();
  else el=renderHome();
  app.appendChild(el);
}

// ═══ HOME ═══
function renderHome(){
  return R("div",{style:{minHeight:"100vh",background:grad,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px"}},
    R("div",{style:{textAlign:"center",marginBottom:"40px"}},
      R("div",{style:{fontSize:"64px",marginBottom:"12px"}},"🧴"),
      R("h1",{style:{fontSize:"28px",fontWeight:"700",color:"#fff"}},"Vendas Promotoras"),
      R("p",{style:{color:"#fce4ec",marginTop:"6px",fontSize:"14px"}},"Controle diário de vendas")
    ),
    R("div",{style:{width:"100%",maxWidth:"320px",display:"flex",flexDirection:"column",gap:"16px"}},
      R("button",{style:{padding:"20px 24px",borderRadius:"20px",fontWeight:"700",fontSize:"17px",border:"none",color:dark,background:"#fff",boxShadow:"0 8px 32px rgba(136,14,79,0.25)",textAlign:"center"},onClick:()=>setState({modo:"promotora",promStep:"login"})},
        "👩 Sou Promotora",R("div",{style:{fontSize:"12px",fontWeight:"400",color:"#9ca3af",marginTop:"4px"}},"Lançar ponto e vendas")
      ),
      R("button",{style:{padding:"20px 24px",borderRadius:"20px",fontWeight:"700",fontSize:"17px",border:"2px solid rgba(255,255,255,0.5)",color:"#fff",background:"rgba(255,255,255,0.15)",textAlign:"center"},onClick:()=>setState({modo:"dashboard",dashSenhaOk:false})},
        "📊 Painel da Gestora",R("div",{style:{fontSize:"12px",fontWeight:"400",color:"#fce4ec",marginTop:"4px"}},"Ver relatórios e rankings")
      )
    )
  );
}

// ═══ LOGIN PROMOTORA ═══
function renderPromotora(){
  if(STATE.promStep==="login") return renderLogin();
  if(!STATE.promotora) return renderLogin();
  const s=STATE.promStep;
  if(s==="menu") return renderMenu();
  if(s==="loja") return renderLojaSelect();
  if(s==="ponto") return renderPonto();
  if(s==="falta") return renderFalta();
  if(s==="okF") return renderOkFalta();
  if(s==="solic") return renderSolic();
  if(s==="okS") return renderOkSolic();
  if(s==="hist") return renderHist();
  if(s==="pag") return renderPag();
  if(s==="pass") return renderPass();
  return renderMenu();
}

function renderLogin(){
  const proms=STATE.proms;
  let nomeEl,senhaEl,step="nome";
  const bg={minHeight:"100vh",background:"linear-gradient(135deg,#fce4ec,#f8bbd0)",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"};

  const cont=R("div",{style:bg});
  const box=R("div",{style:S.card({maxWidth:"360px",width:"100%",padding:"32px"})});
  cont.appendChild(box);

  const icon=R("div",{style:{textAlign:"center",marginBottom:"24px"}},R("div",{style:{fontSize:"56px",marginBottom:"8px"}},"🧴"),R("h1",{style:{fontSize:"24px",fontWeight:"700",color:"#1f2937"}},"Lançar Vendas"),R("p",{style:{color:"#6b7280",fontSize:"13px",marginTop:"4px"}},new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})));
  box.appendChild(icon);

  const lbl=R("label",{style:S.lbl},"Qual é o seu nome?");
  const sel=R("select",{style:S.inp({marginBottom:"16px"})},R("option",{value:""},"Selecione seu nome..."));
  proms.forEach(p=>{const o=R("option",{value:p.nome},p.nome);sel.appendChild(o)});
  box.appendChild(lbl);box.appendChild(sel);

  const errDiv=R("p",{style:{color:"#ef4444",fontSize:"13px",marginBottom:"12px",textAlign:"center",display:"none"}});
  box.appendChild(errDiv);

  const btnCont=R("button",{style:S.btn({opacity:"0.4"}),onClick:async()=>{
    const nome=sel.value;
    if(!nome)return;
    const s=await fb.get(`senhas/${nk(nome)}`);
    if(s) showSenha(nome,s);
    else showCadastro(nome);
  }},"Continuar →");
  sel.addEventListener("change",()=>{btnCont.style.opacity=sel.value?"1":"0.4"});
  box.appendChild(btnCont);

  function showSenha(nome,senhaCorreta){
    box.innerHTML="";
    box.appendChild(R("div",{style:{textAlign:"center",marginBottom:"24px"}},R("div",{style:{fontSize:"48px",marginBottom:"8px"}},"👋"),R("h2",{style:{fontSize:"20px",fontWeight:"700",color:"#1f2937"}},`Olá, ${nome}!`),R("p",{style:{fontSize:"13px",color:"#6b7280",marginTop:"4px"}},"Digite sua senha de 4 números")));
    const sInp=R("input",{type:"password",inputMode:"numeric",maxLength:"4",placeholder:"0000",style:S.inp({marginBottom:"16px",textAlign:"center",fontSize:"28px",letterSpacing:"10px"})});
    const err=R("p",{style:{color:"#ef4444",fontSize:"13px",marginBottom:"12px",textAlign:"center",display:"none"}},"Senha incorreta.");
    box.appendChild(sInp);box.appendChild(err);
    box.appendChild(R("button",{style:S.btn(),onClick:async()=>{
      if(sInp.value===senhaCorreta){STATE.promotora=nome;setState({promStep:"menu"});}
      else{err.style.display="block";sInp.value="";}
    }},"Entrar"));
    box.appendChild(R("button",{style:S.btn({background:"none",color:"#9ca3af",marginTop:"8px"}),onClick:()=>{box.innerHTML="";box.appendChild(icon);box.appendChild(lbl);box.appendChild(sel);box.appendChild(errDiv);box.appendChild(btnCont)}},"← Voltar"));
  }

  function showCadastro(nome){
    box.innerHTML="";
    box.appendChild(R("div",{style:{textAlign:"center",marginBottom:"24px"}},R("div",{style:{fontSize:"48px",marginBottom:"8px"}},"🔐"),R("h2",{style:{fontSize:"20px",fontWeight:"700",color:"#1f2937"}},"Criar senha"),R("p",{style:{fontSize:"13px",color:"#6b7280",marginTop:"4px"}},"Olá ",R("b",null,nome),"! Crie sua senha de 4 números.")));
    const n1=R("input",{type:"password",inputMode:"numeric",maxLength:"4",placeholder:"0000",style:S.inp({marginBottom:"16px",textAlign:"center",fontSize:"24px",letterSpacing:"8px"})});
    const n2=R("input",{type:"password",inputMode:"numeric",maxLength:"4",placeholder:"0000",style:S.inp({marginBottom:"16px",textAlign:"center",fontSize:"24px",letterSpacing:"8px"})});
    const err=R("p",{style:{color:"#ef4444",fontSize:"13px",marginBottom:"12px",textAlign:"center",display:"none"}});
    box.appendChild(R("label",{style:S.lbl},"Nova senha"));box.appendChild(n1);
    box.appendChild(R("label",{style:S.lbl},"Confirmar"));box.appendChild(n2);
    box.appendChild(err);
    box.appendChild(R("button",{style:S.btn(),onClick:async()=>{
      if(n1.value.length!==4||!/^\d+$/.test(n1.value)){err.textContent="Deve ter 4 números.";err.style.display="block";return;}
      if(n1.value!==n2.value){err.textContent="Senhas não coincidem.";err.style.display="block";return;}
      await fb.set(`senhas/${nk(nome)}`,n1.value);
      STATE.promotora=nome;setState({promStep:"menu"});
    }},"Criar senha e entrar"));
  }

  // init proms
  if(proms.length===0){
    fb.get("promotoras").then(val=>{
      if(!val){PROMS_DEF.forEach(p=>fb.push("promotoras",p));}
    });
  }

  return cont;
}

function renderMenu(){
  const p=STATE.promotora;
  const rHoje=STATE.regs.filter(r=>r.promotora===p&&r.data===todayBR());
  const pend=STATE.solics.filter(s=>s.promotora===p&&s.status==="pendente").length;
  const vH=rHoje.filter(r=>r.tipo==="venda").length;

  return R("div",{style:{minHeight:"100vh",background:grad,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px"}},
    R("div",{style:{textAlign:"center",marginBottom:"24px"}},
      R("div",{style:{fontSize:"56px",marginBottom:"8px"}},"🧴"),
      R("h1",{style:{fontSize:"22px",fontWeight:"700",color:"#fff",marginTop:"6px"}},`Olá, ${p}! 👋`),
      R("p",{style:{color:"#fce4ec",fontSize:"13px",marginTop:"4px"}},new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})),
      vH>0?R("div",{style:{marginTop:"10px",background:"rgba(255,255,255,0.2)",borderRadius:"12px",padding:"6px 14px",display:"inline-block"}},R("p",{style:{color:"#fff",fontSize:"12px"}},"✅ Ponto lançado hoje")):null
    ),
    R("div",{style:{width:"100%",maxWidth:"320px",display:"flex",flexDirection:"column",gap:"10px"}},
      menuBtn("🏪","Lançar ponto e vendas","Registrar horários em tempo real","loja",true),
      menuBtn("😷","Registrar falta","Informar ausência","falta",false),
      menuBtn("📋",`Solicitações${pend>0?` (${pend})`:""}` ,"Produtos, sachês, brindes...","solic",false),
      menuBtn("📊","Meu histórico","Ver minhas vendas e faltas","hist",false),
      menuBtn("💰","Meus pagamentos","Ver o que tenho a receber","pag",false),
      menuBtn("🚌","Minhas passagens","Vale-transporte","pass",false),
      R("button",{style:{padding:"8px",borderRadius:"12px",fontWeight:"600",fontSize:"12px",border:"none",color:"rgba(255,255,255,0.4)",background:"transparent",marginTop:"4px"},onClick:()=>setState({modo:"home",promotora:null})},"Sair da conta")
    )
  );
}

function menuBtn(icon,label,sub,step,solid){
  return R("button",{
    style:{padding:"16px 20px",borderRadius:"18px",fontWeight:"700",fontSize:"14px",border:solid?"none":"2px solid rgba(255,255,255,0.35)",color:solid?dark:"#fff",background:solid?"#fff":"rgba(255,255,255,0.1)",boxShadow:solid?"0 8px 24px rgba(136,14,79,0.25)":undefined,textAlign:"center"},
    onClick:()=>setState({promStep:step,promLojaF:"",promMotivoF:"",promTipoS:"",promDescS:"",promEditP:false,promPecasI:""})
  },`${icon} ${label}`,R("div",{style:{fontSize:"11px",fontWeight:"400",color:solid?"#9ca3af":"#fce4ec",marginTop:"2px"}},sub));
}

function renderLojaSelect(){
  const p=STATE.promotora;
  return wrap(
    backBtn("menu"),
    R("div",{style:S.card()},
      R("div",{style:{textAlign:"center",marginBottom:"20px"}},R("p",{style:{fontSize:"18px",fontWeight:"700",color:"#1f2937"}},`Olá, ${p}! 👋`),R("p",{style:{fontSize:"13px",color:"#6b7280",marginTop:"4px"}},"Em qual loja você está hoje?")),
      mkSel(LOJAS,"Selecione a loja...",v=>STATE.promLoja=v,STATE.promLoja),
      R("button",{style:S.btn({marginTop:"16px",opacity:STATE.promLoja?"1":"0.4"}),onClick:()=>{if(STATE.promLoja)setState({promStep:"ponto",promEditP:false,promPecasI:""})}},
        "Continuar →"
      )
    )
  );
}

function renderPonto(){
  const p=STATE.promotora,loja=STATE.promLoja;
  const reg=STATE.regs.find(r=>r.promotora===p&&r.loja===loja&&r.data===todayBR()&&r.tipo==="venda");
  const mins=calcMin(reg);
  const pct=reg?.saidaFinal?Math.min(100,mins/JORNADA*100):0;

  const lancar=async campo=>{
    const h=nowBR();
    if(reg?._k) await fb.update(`registros/${reg._k}`,{[campo]:h});
    else await fb.push("registros",{promotora:p,loja,data:todayBR(),tipo:"venda",[campo]:h,pecas:0,ts:Date.now()});
    render();
  };

  const salvarPecas=async v=>{
    if(!v)return;
    if(reg?._k) await fb.update(`registros/${reg._k}`,{pecas:Number(v)});
    else await fb.push("registros",{promotora:p,loja,data:todayBR(),tipo:"venda",pecas:Number(v),ts:Date.now()});
    setState({promEditP:false});
  };

  const pBtns=[
    {campo:"entrada",label:"Entrada",icon:"🟢"},
    {campo:"saidaAlmoco",label:"Saída almoço",icon:"🍽️"},
    {campo:"voltaAlmoco",label:"Volta almoço",icon:"🔄"},
    {campo:"saidaFinal",label:"Saída final",icon:"🔴"},
  ];

  return R("div",{style:{minHeight:"100vh",background:"#f9f4f7"}},
    R("div",{style:{padding:"28px 20px 20px",background:grad}},
      R("button",{style:{background:"none",border:"none",color:"#f9a8d4",fontWeight:"600",fontSize:"14px",marginBottom:"8px",padding:"0"},onClick:()=>setState({promStep:"loja"})},"← Voltar"),
      R("p",{style:{color:"#f9a8d4",fontSize:"11px",fontWeight:"700",textTransform:"uppercase",letterSpacing:"1px"}},"Ponto do dia"),
      R("h1",{style:{color:"#fff",fontSize:"20px",fontWeight:"700",marginTop:"2px"}},p),
      R("p",{style:{color:"#f9a8d4",fontSize:"13px"}},`${loja} · ${fmtDate(todayBR())}`),
      reg?.saidaFinal?R("div",{style:{marginTop:"10px",background:"rgba(255,255,255,0.2)",borderRadius:"12px",padding:"8px 14px",display:"inline-block"}},R("p",{style:{color:"#fff",fontSize:"13px",fontWeight:"700"}},`${fmtMin(mins)} trabalhadas · ${pct.toFixed(0)}% da jornada`)):null
    ),
    R("div",{style:{padding:"16px"}},
